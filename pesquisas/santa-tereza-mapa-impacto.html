let taxaCmH=D.meta.taxa_cm_h; const vel=D.meta.vel_idoso_ms;
const map=L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.9}).addTo(map);
const CORES={alagada:'#1e5fbf',critica:'#b3382c',apertada:'#e8730c',atencao:'#e3b100',confortavel:'#1b7a5a',alto:'#7a8a84'};
const ROT={alagada:'já na água',critica:'crítica — resgate',apertada:'apertada (<15 min)',atencao:'atenção (<1 h)',confortavel:'confortável (>1 h)',alto:'ponto alto'};
function classe(c,nivel){
  if(c.cota===null||c.cota===undefined) return 'alto';
  if(c.cota<=nivel) return 'alagada';
  const ttw=(c.cota-nivel)/(taxaCmH/100/60), cam=c.dist_m/vel/60, m=ttw-cam;
  return m<0?'critica':m<15?'apertada':m<60?'atencao':'confortavel';
}
const polys=D.cells.map(c=>{const pl=L.polygon(c.poly,{weight:.6,color:'#2b3a34',fillOpacity:.7}).addTo(map);
  pl.bindPopup(()=>`<b>${c.pop} pessoas</b><br>cota que alaga: ${c.cota==null?'ponto alto':c.cota+' m'}<br>a pé ao abrigo: ${(c.dist_m/1000).toFixed(2)} km`); return pl;});
D.abrigos.forEach(a=>L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>'+a.nome+'</b><br>abrigo'));
const b=L.latLngBounds();D.cells.forEach(c=>c.poly.forEach(p=>b.extend(p)));
const BB=b.pad(0.08);function aj(){map.invalidateSize();map.fitBounds(BB);}aj();setTimeout(aj,300);window.addEventListener('resize',aj);
const ordem=['alagada','critica','apertada','atencao','confortavel','alto'];
function render(nivel){
  const cnt={alagada:0,critica:0,apertada:0,atencao:0,confortavel:0,alto:0};
  D.cells.forEach((c,i)=>{const k=classe(c,nivel);cnt[k]+=c.pop;polys[i].setStyle({fillColor:CORES[k]});});
  document.getElementById('nvtxt').textContent=nivel.toFixed(1)+' m';
  document.getElementById('cont').innerHTML=ordem.map(k=>
    `<div class="row"><span><i style="background:${CORES[k]}"></i>${ROT[k]}</span><b>${cnt[k].toLocaleString('pt-BR')}</b></div>`).join('');
  const emrisco=cnt.alagada+cnt.critica+cnt.apertada+cnt.atencao;
  document.getElementById('resumo').innerHTML=`<b>${emrisco.toLocaleString('pt-BR')}</b> pessoas precisam sair · de <b>${D.meta.pop_total.toLocaleString('pt-BR')}</b> no total`;
}
const sld=document.getElementById('sld'),sldTaxa=document.getElementById('sldTaxa'),NVMAX=D.meta.nivel_max_m;
function cen(t){return t<=25?'(cheia lenta)':t>=90?'(ritmo de recorde)':'';}
function redraw(){taxaCmH=+sldTaxa.value;document.getElementById('taxatxt').textContent=taxaCmH;document.getElementById('taxacen').textContent=cen(taxaCmH);render(sld.value/100*NVMAX);}
sld.oninput=redraw;sldTaxa.oninput=redraw;redraw();
</script></body></html>
