const manchaLayer=L.layerGroup(D.mancha.map(p=>L.polygon(p,{color:'#1e5fbf',weight:1,fillColor:'#1e5fbf',fillOpacity:.16})));
const b=L.latLngBounds();
const ruas=D.edges.map(([a,c,ag])=>{const A=D.nos[a],C=D.nos[c];b.extend(A);b.extend(C);
  return {pl:L.polyline([A,C],{weight:2,opacity:.8}),a,c,ag};});
const ruasLayer=L.layerGroup(ruas.map(r=>r.pl));
const cellsPl=D.cells.map(c=>L.polygon(c.poly,{weight:.6,color:'#2b3a34',fillOpacity:.7})
  .bindPopup(()=>`<b>${c.pop} pessoas</b><br>alaga na cota ${c.cota==null?'—(alto)':c.cota+' m'}<br>a pé: ${(c.dist_m/1000).toFixed(2)} km`));
const cellsLayer=L.layerGroup(cellsPl);
const abrigos=L.layerGroup(D.abrigos.map(a=>L.marker([a.lat,a.lon]).bindPopup('<b>'+a.nome+'</b><br>abrigo / ponto de encontro')));
const BB=b.pad(0.06);function aj(){map.invalidateSize();map.fitBounds(BB);}
function classe(cota,dist,nivel){ if(cota===null||cota===undefined)return 'alto'; if(cota<=nivel)return 'alagada';
  const m=(cota-nivel)/(taxaCmH/100/60)-dist/vel/60; return m<0?'critica':m<15?'apertada':m<60?'atencao':'confortavel';}
function pior(x,y){return ordem.indexOf(x)<ordem.indexOf(y)?x:y;}
// ---- render por modo ----
let modo='rotas';
function nivelAtual(){return sld.value/100*NVMAX;}
function renderRotas(){
  ruas.forEach(r=>r.pl.setStyle({color:r.ag?'#b3382c':'#8fa7b8',weight:r.ag?2.5:1.5,opacity:r.ag?.7:.5}));
  document.getElementById('painel').innerHTML='<div class="sub">Clique em qualquer ponto do mapa para ver a rota a pé até o abrigo mais próximo, evitando a mancha.</div><div class="rota" id="rota">—</div>';
}
function renderMargem(){const nivel=nivelAtual();const cnt={alagada:0,critica:0,apertada:0,atencao:0,confortavel:0,alto:0};
  const cl=D.nos.map((_,i)=>classe(D.cota_no[i],D.dist_m[i],nivel));cl.forEach(k=>cnt[k]++);
  ruas.forEach(r=>r.pl.setStyle({color:CORES[pior(cl[r.a],cl[r.c])],weight:2.5,opacity:.85}));
  document.getElementById('nvtxt').textContent=nivel.toFixed(1)+' m';
  document.getElementById('painel').innerHTML='<div class="sub">Ruas coloridas pela margem de fuga (quadras).</div>'+
    ordem.map(k=>`<div class="row"><span><i style="background:${CORES[k]}"></i>${ROT[k]}</span><b>${cnt[k]}</b></div>`).join('');
}
function renderImpacto(){const nivel=nivelAtual();const cnt={alagada:0,critica:0,apertada:0,atencao:0,confortavel:0,alto:0};
  D.cells.forEach((c,i)=>{const k=classe(c.cota,c.dist_m,nivel);cnt[k]+=c.pop;cellsPl[i].setStyle({fillColor:CORES[k]});});
  document.getElementById('nvtxt').textContent=nivel.toFixed(1)+' m';
  const risco=cnt.alagada+cnt.critica+cnt.apertada+cnt.atencao;
  document.getElementById('painel').innerHTML=ordem.map(k=>`<div class="row"><span><i style="background:${CORES[k]}"></i>${ROT[k]}</span><b>${cnt[k].toLocaleString('pt-BR')}</b></div>`).join('')+
    `<div class="big"><b>${risco.toLocaleString('pt-BR')}</b> pessoas precisam sair · de <b>${D.meta.pop_total.toLocaleString('pt-BR')}</b></div>`;
}
function redraw(){taxaCmH=+sldTaxa.value;document.getElementById('taxatxt').textContent=taxaCmH;
  document.getElementById('taxacen').textContent=taxaCmH<=25?'(lenta)':taxaCmH>=90?'(recorde)':'';
  if(modo==='margem')renderMargem(); else if(modo==='impacto')renderImpacto();}
// interacao rotas
let cam=null,orig=null;
map.on('click',e=>{ if(modo!=='rotas')return;
  let best=-1,bd=1e18;for(let i=0;i<D.nos.length;i++){const dy=e.latlng.lat-D.nos[i][0],dx=(e.latlng.lng-D.nos[i][1])*Math.cos(e.latlng.lat*Math.PI/180),dd=dy*dy+dx*dx;if(dd<bd){bd=dd;best=i;}}
  const pts=[];let i=best,g=0;while(i>=0&&g++<6000){pts.push(D.nos[i]);const nx=D.prox[i];if(nx===i||nx<0)break;i=nx;}
  if(cam)map.removeLayer(cam);if(orig)map.removeLayer(orig);
  cam=L.polyline(pts,{color:'#0f8b46',weight:5,opacity:.95}).addTo(map);
  orig=L.circleMarker(D.nos[best],{radius:7,color:'#0f8b46',fillColor:'#fff',fillOpacity:1,weight:3}).addTo(map);
  const ab=D.abrigos.find(x=>x.id===D.dest[best])||D.abrigos[0],dm=D.dist_m[best],ag=D.agua_m[best];
  document.getElementById('rota').innerHTML=`<b>Rota até ${ab?ab.nome:'abrigo'}</b><br>A pé: <b>${(dm/1000).toFixed(2)} km</b>`+
    (ag>0?`<br><span style="color:#b3382c">⚠ ${Math.round(ag)} m em área que alaga.</span>`:`<br><span style="color:#0f8b46">Fora da mancha.</span>`);});
// troca de aba
function setModo(m){modo=m;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.m===m));
  document.getElementById('sliders').classList.toggle('hide',m==='rotas');
  [manchaLayer,ruasLayer,cellsLayer].forEach(l=>map.removeLayer(l));
  if(cam){map.removeLayer(cam);cam=null;} if(orig){map.removeLayer(orig);orig=null;}
  manchaLayer.addTo(map); abrigos.addTo(map);
  if(m==='impacto'){cellsLayer.addTo(map);renderImpacto();}
  else{ruasLayer.addTo(map); if(m==='margem')renderMargem(); else renderRotas();}
}
document.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>setModo(x.dataset.m));
const sld=document.getElementById('sld'),sldTaxa=document.getElementById('sldTaxa');
sld.oninput=redraw;sldTaxa.oninput=redraw;
document.getElementById('taxatxt').textContent=taxaCmH;
setModo('rotas'); aj(); setTimeout(aj,300); window.addEventListener('resize',aj);
</script></body></html>
