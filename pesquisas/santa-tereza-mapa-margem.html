const map=L.map('map');

const ROT={alagada:'já na água',critica:'crítica — precisa de resgate',apertada:'apertada (<15 min)',atencao:'atenção (<1 h)',confortavel:'confortável (>1 h)',alto:'ponto alto (não alaga)'};
const vel=D.meta.vel_idoso_ms;
function classifica(i,nivel){
  const cota=D.cota_alaga_m[i];
  if(cota===null||cota===undefined) return 'alto';
  if(cota<=nivel) return 'alagada';
  const taxa_m_min=taxaCmH/100/60;                  // subida atual (slider)
  const ttw=(cota-nivel)/taxa_m_min;               // min ate a agua
  const cam=D.dist_m[i]/vel/60;                     // min de caminhada
  const m=ttw-cam;
  if(m<0) return 'critica'; if(m<15) return 'apertada'; if(m<60) return 'atencao'; return 'confortavel';
}

const ordem=['confortavel','atencao','apertada','critica','alagada','alto'];
function pior(x,y){return ordem.indexOf(x)>ordem.indexOf(y)?x:y;} // classe mais urgente
function render(nivel){
  const cnt={alagada:0,critica:0,apertada:0,atencao:0,confortavel:0,alto:0};
  const cls=D.nos.map((_,i)=>classifica(i,nivel));
  cls.forEach(c=>cnt[c]++);
  linhas.forEach(([pl,a,c])=>{const k=pior(cls[a],cls[c]);pl.setStyle({color:CORES[k]});});
  document.getElementById('nvtxt').textContent=nivel.toFixed(1)+' m';
  document.getElementById('cont').innerHTML=ordem.map(k=>
    `<div class="row"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${CORES[k]};margin-right:6px"></i>${ROT[k]}</span><b>${cnt[k]}</b></div>`).join('');
}
document.getElementById('leg').innerHTML='';
const sld=document.getElementById('sld'), sldTaxa=document.getElementById('sldTaxa'), NVMAX=D.meta.nivel_max_m;
function cenarioTaxa(t){return t<=25?'(cheia lenta)':t>=90?'(ritmo de recorde)':'';}
function redraw(){

}
