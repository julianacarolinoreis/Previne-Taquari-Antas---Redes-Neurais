name: atlascampo
description: Aplicativo multiplataforma de mapas offline e coleta de dados em campo.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_map: ^7.0.2
  flutter_map_mbtiles: ^1.0.4
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  file_picker: ^12.1.3
  path_provider: ^2.1.5
  path: ^1.9.0
  sqflite: ^2.4.1
  uuid: ^4.5.1
  xml: ^6.5.0
  archive: ^4.0.2
  intl: ^0.19.0
  http: ^1.2.0
  geoimage: ^0.4.1+3
  image: ^4.5.4
  proj4dart: ^2.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
