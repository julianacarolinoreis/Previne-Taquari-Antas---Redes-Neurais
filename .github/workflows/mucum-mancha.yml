# ROBÔ — mancha de inundação de Muçum a partir do MOSAICO 2 m.
# Não regenera a partir do ANADEM 30 m puro (isso sobrescreveria o mosaico).
# Exige o GeoTIFF do mosaico commitado/local:
#   assets/data/mucum_inundacao/mdt/mdt_mucum_mosaico_2m.tif
# Depois sincroniza o HAND da página de previsão ao vivo.
# Roda no botão (Run workflow); commita na própria branch em que foi disparado.

name: Muçum — mancha de inundação (HAND)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mucum-mancha-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mancha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências geoespaciais
        run: pip install numpy scipy rasterio pillow

      - name: Exigir mosaico 2 m (bloquear ANADEM-only)
        run: |
          MOS="assets/data/mucum_inundacao/mdt/mdt_mucum_mosaico_2m.tif"
          if [ ! -f "$MOS" ]; then
            echo "::error::Mosaico ausente ($MOS). Gere com gerar_mosaico_mdt.py mucum antes de disparar este workflow. Não usar gerar_mancha_mucum.py (ANADEM-only)."
            exit 1
          fi
          ls -lh "$MOS"

      - name: Gerar HAND do mosaico e injetar em mucum_inundacao.html
        run: python codigo_python/02_mdt_hand_mancha/gerar_mancha_mosaico.py mucum

      - name: Sincronizar HAND da previsão ao vivo
        run: python codigo_python/01_previsao_ao_vivo/atualizar_hand_previsao_mucum.py

      - name: Commitar páginas de Muçum
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git add mucum_inundacao.html mucum_previsao_inundacao.html
          git diff --staged --quiet && { echo "sem mudança"; exit 0; }
          git commit -m "bot: mancha Muçum (HAND do mosaico 2 m) [skip ci]"
          BR="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BR" && git push origin HEAD:"$BR" && exit 0
            echo "push rejeitado ($i), rebase..."; sleep 3
          done
          echo "falha ao empurrar"; exit 1
