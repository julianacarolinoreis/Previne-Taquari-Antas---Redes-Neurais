name: HEC Muçum full-event quick

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hec-mucum-full-event-quick.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hec-mucum-full-event-quick
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --disable-pip-version-check shapely pyproj matplotlib numpy

      - name: Refresh full observed multistation package
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: Refresh spatial ECMWF IFS
        run: python -B scripts/build_spatial_ifs_mucum.py

      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 -o /tmp/HEC-HMS-4.13-linux64.tar.gz https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Full-event HEC search from 26/09
        shell: bash
        run: |
          set -euo pipefail
          unset HEC_WARM_START_LOCAL || true
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          python -B scripts/run_hec_hms_mucum_full_event_quick.py "$HEC_SH"

      - name: Publish result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-full-event-bot"
          git config user.email "previne-hec-full-event-bot@users.noreply.github.com"
          git add --             assets/data/estudo_bacia_taquari_antas/hec_hms_full_event_quick_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_full_event_quick_candidates.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: HEC Muçum full-event quick [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
