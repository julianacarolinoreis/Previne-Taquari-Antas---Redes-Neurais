name: PREVINE AI Lab - pacote sombra

on:
  push:
    branches: [main]
    paths:
      - "assets/data/ai_lab/auto_training_v2_latest.json"
      - "scripts/ai_lab_build_shadow_bundle.py"
      - ".github/workflows/ai-lab-shadow-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previne-ai-lab-shadow-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ai_lab_auto_train.py
            scripts/ai_lab_temporal_train.py
            scripts/ai_lab_build_shadow_bundle.py
            assets/data/ai_lab
            assets/audit_workbooks
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install shadow runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.5.3" "openpyxl==3.1.5" "scikit-learn==1.9.1" "joblib==1.6.0"
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Build research-only shadow bundle
        run: |
          python -B scripts/ai_lab_build_shadow_bundle.py

      - name: Publish shadow manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ai_lab/shadow_bundle_manifest.json
          if git diff --cached --quiet; then
            echo "No shadow manifest changes."
          else
            git commit -m "Update AI Lab shadow bundle manifest"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: previne-ai-lab-shadow-bundle
          path: |
            artifacts/ai_lab_shadow/**
            assets/data/ai_lab/shadow_bundle_manifest.json
