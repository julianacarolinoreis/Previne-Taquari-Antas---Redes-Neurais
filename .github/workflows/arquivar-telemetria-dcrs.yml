# Arquiva a telemetria da ANA das 20 estações da Defesa Civil RS na bacia Taquari-Antas.
# A ANA só devolve poucas semanas dessas estações; sem este arquivo a chuva delas se perde para calibração.
# Só acrescenta linhas em assets/data/dcrs_telemetria/ (não toca em nenhum feed do site).
name: Arquivo telemetria DCRS

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Quantos dias para trás consultar (padrão 3)'
        required: false
        default: '3'

jobs:
  arquivar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: arquivo-telemetria-dcrs
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Testes e arquivo
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git pull --rebase --autostash origin main
          python -B -m unittest scripts.test_arquivar_telemetria_dcrs
          timeout --signal=TERM --kill-after=20s 900s python -B scripts/arquivar_telemetria_dcrs.py "${{ github.event.inputs.dias || '3' }}"
          git add assets/data/dcrs_telemetria
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
            exit 0
          fi
          git commit -m "bot: arquivo telemetria DCRS [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push rejeitado (${tentativa}), rebase..."
            sleep 3
          done
          echo "falha ao publicar o arquivo"
          exit 1
