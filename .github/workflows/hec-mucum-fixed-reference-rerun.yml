name: HEC Muçum fixed reference rerun

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hec-mucum-fixed-reference-rerun.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hec-mucum-fixed-reference-rerun
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --disable-pip-version-check shapely pyproj matplotlib numpy

      - name: Observado multirrede atualizado
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: ECMWF IFS espacial atualizado
        run: python -B scripts/build_spatial_ifs_mucum.py

      - name: Cache HEC-HMS
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Baixa HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4             -o /tmp/HEC-HMS-4.13-linux64.tar.gz             https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Roda configuracao congelada do grafico de referencia
        shell: bash
        env:
          HEC_PARAM_EVENT: E28
          HEC_INITIAL_LOSS_MM: "20"
          HEC_CONSTANT_LOSS_MM_H: "3"
          HEC_TC_H: "25"
          HEC_STORAGE_H: "20"
          HEC_RECESSION: "0.9"
          HEC_INITIAL_FLOW_MULTIPLIER: "0.75"
        run: |
          set -euo pipefail
          python -B scripts/build_hec_hms_spatial_forecast_mucum.py
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          "$HEC_SH" -s assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/project/run_forecast.script
          python -B scripts/postprocess_hec_hms_spatial_forecast_mucum.py
          cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json              assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_reference_rerun_latest.json
          cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/primary_series.csv              assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_reference_rerun_series.csv

      - name: Publica resultado dedicado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-reference-bot"
          git config user.email "previne-hec-reference-bot@users.noreply.github.com"
          git add --             assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_reference_rerun_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_reference_rerun_series.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "bot: rerun Muçum fixed 28-09 reference [skip ci]"
          git push origin HEAD:main
