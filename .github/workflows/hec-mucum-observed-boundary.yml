# short restart 2026-09-29 19:36 BRT
name: HEC Muçum observed boundary
# dual observed branches: all observed gauges + native t0 match

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hec-mucum-observed-boundary.yml"
      - "scripts/run_hec_hms_mucum_dual_boundary.py"
      - "scripts/run_hec_hms_mucum_dual_route_sweep.py"
      - "scripts/run_hec_hms_mucum_state_routing_sweep.py"
      - "scripts/run_hec_hms_mucum_iterative_validation.py"
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            assets/data/estudo_bacia_taquari_antas
            assets/data/hec_hms_spatialized_mucum
            previsao_ao_vivo_mucum.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --disable-pip-version-check shapely pyproj numpy matplotlib

      - name: Refresh observed state
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: Refresh ECMWF spatial forcing
        run: |
          python -B scripts/build_spatial_ifs_mucum.py
          python -B scripts/build_hec_twin_ifs_spatial_forcing_5d.py

      - uses: actions/cache@v4
        id: cache-hec
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13 if needed
        if: steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 \
            -o /tmp/HEC-HMS-4.13-linux64.tar.gz \
            https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Build full-event rain timeline
        run: python -B scripts/build_hec_hms_spatial_forecast_mucum.py

      - name: Recalibrate HEC until validation criteria pass
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          python -B scripts/run_hec_hms_mucum_iterative_validation.py "$HEC_SH"

      - name: Show operational validation status
        shell: bash
        run: |
          python - <<'PY'
          import json
          p="assets/data/estudo_bacia_taquari_antas/hec_hms_dual_boundary_mucum_latest.json"
          o=json.load(open(p,encoding="utf-8"))
          v=o.get("operational_validation") or {}
          print("STATUS:",v.get("status"))
          print("CHECKS:",json.dumps(v.get("checks"),ensure_ascii=False))
          print("VALUES:",json.dumps(v.get("values"),ensure_ascii=False))
          print("SELECTED:",json.dumps(v.get("selected"),ensure_ascii=False))
          print("PEAK:",json.dumps(o.get("peak"),ensure_ascii=False))
          PY

      - name: Publish result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-observed-boundary-bot"
          git config user.email "previne-hec-observed-boundary-bot@users.noreply.github.com"

          RESULT_JSON="assets/data/estudo_bacia_taquari_antas/hec_hms_dual_boundary_mucum_latest.json"
          RESULT_CSV="assets/data/estudo_bacia_taquari_antas/hec_hms_dual_boundary_mucum/primary_series.csv"
          cp "$RESULT_JSON" /tmp/hec_hms_dual_boundary_mucum_latest.json
          cp "$RESULT_CSV" /tmp/hec_hms_dual_boundary_primary_series.csv

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$RESULT_CSV")"
            cp /tmp/hec_hms_dual_boundary_mucum_latest.json "$RESULT_JSON"
            cp /tmp/hec_hms_dual_boundary_primary_series.csv "$RESULT_CSV"
            git add -- "$RESULT_JSON" "$RESULT_CSV"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "bot: HEC Muçum dual observed branches [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

# rerun: 2026-09-29 21:12 BRT · iterative validation protocol
