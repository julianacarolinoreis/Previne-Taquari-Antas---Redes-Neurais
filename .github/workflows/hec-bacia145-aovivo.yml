name: HEC bacia 145 - ciclo ao vivo

# Um ciclo do HEC-HMS ao vivo (145 sub-bacias, md-val2-c002) no GitHub (Linux): chuva observada da rede ANA +
# CEMADEN (histórico do coletor na branch de dados) + INMET (secret INMET_TOKEN, se existir), chuva prevista
# ECMWF/GFS (dados abertos, por byte-range), HEC por cenário (partida a frio adaptativa), correção aditiva e nível.
# Estado entre ciclos (--estado) fica desligado: não melhorou no experimento retroativo (ver LEIAME); para ligar,
# passar --estado DIR e guardar DIR com actions/cache (restaurar pelo prefixo da chave).
# PESQUISA — nada aqui é alerta oficial. Ver calibracao_hec_bacia145/operacional/LEIAME.md.
#  - push na branch do sistema (pasta operacional/ ou este arquivo): roda um ciclo ao vivo;
#  - workflow_dispatch e schedule só valem quando o arquivo estiver na branch padrão.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "aovivo | retro"
        default: aovivo
        type: string
      t0:
        description: "retro: hora de emissão local (AAAA-MM-DDTHH:MM)"
        default: ""
        type: string
      horizonte:
        description: "horizonte em horas (48 a 120)"
        default: "120"
        type: string
      cenarios:
        description: "cenários de chuva prevista"
        default: "ecmwf,gfs,zero"
        type: string
  schedule:
    - cron: "40 1,7,13,19 * * *"     # ~1 h depois das rodadas 00/06/12/18 UTC do ECMWF ficarem completas
  push:
    branches: ["cursor/hec-bacia145-sistema"]
    paths:
      - "calibracao_hec_bacia145/operacional/*.py"
      - "calibracao_hec_bacia145/operacional/dados/**"
      - "calibracao_hec_bacia145/operacional/parametros/**"
      - ".github/workflows/hec-bacia145-aovivo.yml"

permissions:
  contents: read

concurrency:
  group: hec-bacia145-aovivo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODO: ${{ github.event.inputs.modo || 'aovivo' }}
      T0: ${{ github.event.inputs.t0 || '' }}
      HORIZONTE: ${{ github.event.inputs.horizonte || '120' }}
      CENARIOS: ${{ github.event.inputs.cenarios || 'ecmwf,gfs,zero' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: calibracao_hec_bacia145
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install --disable-pip-version-check numpy requests "eccodes==2.49.0" ecmwflibs
      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1
      - name: Baixar HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 -o /tmp/HEC-HMS-4.13-linux64.tar.gz https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec
      - name: Histórico CEMADEN (branch de dados)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dados/cemaden
          cd dados && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin cursor/hec-bacia145-sistema-dados; then
            git checkout -q FETCH_HEAD -- . && ls cemaden | tail -n 3
          else
            echo "sem branch de dados: CEMADEN só com a coleta do próprio ciclo"
          fi
      - name: Rodar o ciclo
        env:
          INMET_TOKEN: ${{ secrets.INMET_TOKEN }}
        run: |
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          chmod +x "$HEC_SH"
          python -c "import eccodes; print('eccodes', eccodes.codes_get_api_version())"
          EXTRA=""
          if [ "$MODO" = "retro" ]; then EXTRA="--t0 $T0"; fi
          cd calibracao_hec_bacia145/operacional
          python -B ciclo.py --modo "$MODO" $EXTRA --horizonte "$HORIZONTE" --cenarios "$CENARIOS" \
            --hec-cmd "$HEC_SH" --trabalho "$RUNNER_TEMP/trabalho" --saida "$RUNNER_TEMP/saida" \
            --cemaden "$GITHUB_WORKSPACE/dados/cemaden"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hec-aovivo-${{ github.run_id }}
          path: ${{ runner.temp }}/saida
          retention-days: 7
          if-no-files-found: warn
