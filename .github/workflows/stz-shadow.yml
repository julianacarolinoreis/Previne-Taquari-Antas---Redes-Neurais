name: Santa Tereza - N5 publica e arquiteturas do usuario em sombra

on:
  push:
    branches: [main]
    paths:
      - 'previne/robo/stz_shadow_common.py'
      - 'previne/robo/stz_model_architectures.py'
      - 'previne/robo/gerar_sombra_stz_*.py'
      - 'assets/models/stz_user_shadow/**'
      - 'assets/mat/sombra_santa_tereza_v2/**'
      - 'assets/data/stz_user_models/**'
      - 'assets/data/stz_n5_sombra_contrato.json'
      - '.github/workflows/stz-shadow.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stz-modelos-sombra
  cancel-in-progress: false

jobs:
  sombra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            previne/robo
            scripts
            assets/models/stz_user_shadow
            assets/mat/sombra_santa_tereza_v2
            assets/data/stz_user_models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar runtime dos modelos congelados
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.0 xgboost==3.4.1 joblib==1.5.3
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verificar contratos e historico prospectivo
        run: python -B -m unittest scripts.test_stz_shadow
      - name: Executar N5 de 4 h em sombra publica
        run: timeout --signal=TERM --kill-after=20s 240s python -B -m previne.robo.gerar_sombra_stz_n5
      - name: Executar arquiteturas da versao de usuario
        run: timeout --signal=TERM --kill-after=20s 240s python -B -m previne.robo.gerar_sombra_stz_usuario
      - uses: actions/upload-artifact@v4
        with:
          name: stz-sombra-${{ github.run_id }}
          path: |
            previsao_sombra_stz_n5.json
            historico_sombra_stz_n5.json
            previsao_sombra_stz_usuario.json
            historico_sombra_stz_usuario.json
      - name: Publicar somente feeds e historicos de sombra
        run: |
          git config user.name 'previne-robo'
          git config user.email 'previne-robo@users.noreply.github.com'
          git add previsao_sombra_stz_n5.json historico_sombra_stz_n5.json previsao_sombra_stz_usuario.json historico_sombra_stz_usuario.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'bot: atualiza acompanhamento STZ em sombra [skip ci]'
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
