name: Diagnóstico Clark x routing v3 rápido

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-clark-routing-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-clark-routing-v3
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            assets/data/estudo_bacia_taquari_antas
            assets/data/chuvas_horarias.csv
            assets/data/hec_hms_audit/raw/ana
            assets/data/hec_hms_carreiro_split/raw_ana
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run fast separation diagnostic
        run: python -B scripts/diagnose_clark_routing_separation.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-routing-diagnostic-bot"
          git config user.email "previne-routing-diagnostic-bot@users.noreply.github.com"
          git add -- assets/data/estudo_bacia_taquari_antas/clark_routing_separation
          git diff --cached --quiet && exit 0
          git commit -m "exp: Clark x routing diagnóstico rápido [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
