name: HEC Muçum operational restart

# rerun requested from chat · all-station accumulated rainfall + observed flow/state + spatial ECMWF

# rerun: 2026-09-30 14:50 BRT · restart dinâmico na recessão com observados e ECMWF atualizados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hec-mucum-operational-restart.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hec-mucum-operational-restart
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --disable-pip-version-check shapely pyproj matplotlib numpy

      - name: Refresh observed multistation package
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: Set dynamic restart window
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          p = "assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_latest.json"
          j = json.load(open(p, encoding="utf-8"))
          st = next(x for x in j["flow"]["stations"] if str(x.get("code")) == "86510000")
          times = [
              datetime.fromisoformat(str(x["time_local"]))
              for x in st.get("series", [])
              if x.get("flow_m3s") is not None or x.get("level") is not None
          ]
          if not times:
              raise SystemExit("Muçum sem estado observado para definir restart")
          t0 = max(times).replace(minute=0, second=0, microsecond=0)
          warm = t0 - timedelta(hours=18)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"HEC_WARM_START_LOCAL={warm.isoformat(timespec='minutes')}\n")
          print(f"t0={t0.isoformat(timespec='minutes')} warm_start={warm.isoformat(timespec='minutes')} window=18h")
          PY

      - name: Refresh spatial ECMWF IFS
        run: python -B scripts/build_spatial_ifs_mucum.py

      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4             -o /tmp/HEC-HMS-4.13-linux64.tar.gz             https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Targeted operational restart search
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          python -B scripts/run_hec_hms_mucum_operational_restart.py "$HEC_SH"

      - name: Publish restart result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-restart-bot"
          git config user.email "previne-hec-restart-bot@users.noreply.github.com"
          git add --             assets/data/estudo_bacia_taquari_antas/hec_hms_operational_restart_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_operational_restart_candidates.csv             assets/data/estudo_bacia_taquari_antas/hec_hms_operational_restart_series.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "bot: HEC Muçum operational restart [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
