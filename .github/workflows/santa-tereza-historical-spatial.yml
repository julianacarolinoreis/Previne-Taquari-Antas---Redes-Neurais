name: Reconstrução histórica espacial de Santa Tereza

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_santa_tereza_historical_spatial.py'
      - 'assets/data/santa_tereza_inundacao/contornos_mancha.json'
      - 'assets/data/santa_tereza_inundacao/hand_lidar_5m_diagnostic.json'
      - 'assets/data/santa_tereza_inundacao/painel_evacuacao_hand_campo_diagnostic.json'
      - 'assets/data/estudo_caso_territorio/grade_200m_santa_tereza.geojson'
      - 'assets/data/estudo_caso_territorio/ruas_santa_tereza.json'
      - 'pesquisas/estudo-caso-territorio.html'
      - 'assets/js/estudo_caso_territorio.js'
      - 'assets/css/estudo_caso_territorio.css'
      - 'assets/data/estudo_caso_territorio/casos_acoplados.json'
      - '.github/workflows/santa-tereza-historical-spatial.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santa-tereza-historical-spatial
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_santa_tereza_historical_spatial.py
            /assets/data/santa_tereza_inundacao/contornos_mancha.json
            /assets/data/santa_tereza_inundacao/hand_lidar_5m_diagnostic.json
            /assets/data/santa_tereza_inundacao/painel_evacuacao_hand_campo_diagnostic.json
            /assets/data/estudo_caso_territorio/grade_200m_santa_tereza.geojson
            /assets/data/estudo_caso_territorio/ruas_santa_tereza.json
            /assets/data/estudo_caso_territorio/santa_tereza_event_spatial.json
            /assets/data/estudo_caso_territorio/casos_acoplados.json
            /assets/js/estudo_caso_territorio.js
            /assets/css/estudo_caso_territorio.css
            /pesquisas/estudo-caso-territorio.html

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependência geoespacial
        run: pip install shapely

      - name: Reconstruir manchas históricas
        run: python -B scripts/build_santa_tereza_historical_spatial.py

      - name: Validar contrato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/data/estudo_caso_territorio/santa_tereza_event_spatial.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows={x['case_id']:x for x in d['events']}
          assert set(rows)=={'st-e4-set2023','st-e6-nov2023','st-e9-mai2024'}
          assert rows['st-e4-set2023']['contour_level_m']==22.4
          assert rows['st-e6-nov2023']['contour_level_m']==20.0
          assert rows['st-e9-mai2024']['contour_level_m']==20.8
          assert d['calibration']['gauge_zero_hand_m']==1.6
          assert d['calibration']['d8_scheme']=='esri'
          assert all(x['scenario']['cells_200m_touched']>0 for x in rows.values())
          assert all(x['scenario']['road_centerline_edges_total']>0 for x in rows.values())
          cases=json.loads(Path('assets/data/estudo_caso_territorio/casos_acoplados.json').read_text(encoding='utf-8'))
          by_id={x['id']:x for x in cases['cases']}
          assert by_id['st-e4-set2023']['hand_m']==22.4
          assert by_id['st-e6-nov2023']['hand_m']==20.0
          assert by_id['st-e9-mai2024']['hand_m']==20.8
          html=Path('pesquisas/estudo-caso-territorio.html').read_text(encoding='utf-8')
          assert '20261001-case7' in html
          js=Path('assets/js/estudo_caso_territorio.js').read_text(encoding='utf-8')
          assert 'historicalSpatialEvent' in js
          assert 'road_centerline_edges_touched' in js
          print('OK: três espacializações históricas distintas e auditáveis')
          PY

      - name: Validar sintaxe JavaScript
        run: node --check assets/js/estudo_caso_territorio.js

      - name: Publicar artefato
        shell: bash
        run: |
          git config user.name "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git add -- assets/data/estudo_caso_territorio/santa_tereza_event_spatial.json
          if git diff --staged --quiet; then
            echo "sem mudança"
            exit 0
          fi
          git commit -m "bot: atualiza manchas históricas Santa Tereza [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "retry $tentativa"
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python -B scripts/build_santa_tereza_historical_spatial.py
            git add -- assets/data/estudo_caso_territorio/santa_tereza_event_spatial.json
            git commit -m "bot: atualiza manchas históricas Santa Tereza [skip ci]" || exit 0
            sleep $((tentativa*2))
          done
          exit 1
