name: HEC Mucum ECMWF 06Z corrected 24h

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hec-mucum-ecmwf-06z-quick.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hec-mucum-ecmwf-06z-corrected
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
          python -m pip install --disable-pip-version-check shapely pyproj matplotlib numpy attrs cffi findlibs
          python -m pip install --disable-pip-version-check --no-deps eccodes==2.48.0

      - name: Refresh the latest live Muçum state
        run: |
          git fetch origin main
          git checkout origin/main -- previsao_ao_vivo_mucum.json || true

      - name: Observed basin rainfall through latest time
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: Exact ECMWF IFS 06Z spatial field through +48h
        env:
          IFS_CYCLE_UTC: "2026-09-29T06:00:00Z"
          IFS_MAX_STEP_H: "48"
        run: python -B scripts/build_spatial_ifs_mucum_ecmwf_direct_cycle.py

      - name: Cache HEC-HMS
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 -o /tmp/HEC-HMS-4.13-linux64.tar.gz https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: HEC-HMS fixed reference calibration with current-state match
        shell: bash
        run: |
          set -euo pipefail
          export HEC_PARAM_EVENT=E28
          export HEC_INITIAL_LOSS_MM=20
          export HEC_CONSTANT_LOSS_MM_H=3
          export HEC_TC_H=25
          export HEC_STORAGE_H=20
          export HEC_RECESSION_DAILY=0.90
          export HEC_INITIAL_FLOW_MULTIPLIER=0.72
          python -B scripts/build_hec_hms_spatial_forecast_mucum.py
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          rm -f assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/hec_output_values.csv
          "$HEC_SH" -s assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/project/run_forecast.script
          python -B scripts/postprocess_hec_hms_spatial_forecast_mucum.py

      - name: Package corrected 24h result
        run: |
          mkdir -p /tmp/mucum_corrected
          cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json /tmp/mucum_corrected/hec_latest.json
          cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/primary_series.csv /tmp/mucum_corrected/hec_series.csv
          cp assets/data/estudo_bacia_taquari_antas/spatial_ifs_mucum/spatial_ifs_mucum_direct_06z_latest.json /tmp/mucum_corrected/ecmwf_06z_spatial.json
          cp assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_latest.json /tmp/mucum_corrected/observed_multistation.json
          cp assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_rain_hourly.csv /tmp/mucum_corrected/observed_rain_hourly.csv
          cp previsao_ao_vivo_mucum.json /tmp/mucum_corrected/live_mucum.json

      - uses: actions/upload-artifact@v4
        with:
          name: mucum-ecmwf-06z-corrected-24h
          path: /tmp/mucum_corrected
