name: Buscar referência SBSR (temporário)

# Workflow temporário: o ambiente de edição não acessa os sites do SBSR/INPE.
# Este job baixa as normas, os templates e trabalhos de referência do SBSR e
# imprime no log o padrão de formatação (fontes, tamanhos, margens, seções,
# legendas, referências). Nada é gravado no repositório. Remover após o uso.

on:
  workflow_dispatch:
  push:
    branches: [claude/elegant-gauss-fhl22a]
    paths: ['.github/workflows/buscar-referencia-sbsr.yml']

permissions:
  contents: read

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf requests beautifulsoup4 python-docx
      - name: Baixar e analisar
        shell: python
        run: |
          import io, re, zipfile
          from urllib.parse import urljoin, urlparse
          import requests, pymupdf, docx
          from bs4 import BeautifulSoup

          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
               "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8"}
          S = requests.Session(); S.headers.update(H)
          VISTOS = set()
          N_PDF = [0]

          def get(u):
              try:
                  r = S.get(u, timeout=60, allow_redirects=True)
                  print(f"GET {u} -> {r.status_code} {r.headers.get('content-type')} {len(r.content)} B final={r.url}", flush=True)
                  return r
              except Exception as e:
                  print("ERRO", u, e, flush=True); return None

          def texto(html, n=6000):
              soup = BeautifulSoup(html, "html.parser")
              for t in soup(["script", "style", "noscript"]): t.decompose()
              return re.sub(r"\s+", " ", soup.get_text(" ", strip=True))[:n]

          def links(r):
              soup = BeautifulSoup(r.text, "html.parser")
              out = []
              for a in soup.find_all(["a", "iframe", "frame"]):
                  h = a.get("href") or a.get("src")
                  if h and not h.startswith(("javascript:", "mailto:", "#")):
                      out.append((a.get_text(" ", strip=True)[:90], urljoin(r.url, h)))
              return out

          def analisa_pdf(nome, data, paginas="todas"):
              N_PDF[0] += 1
              doc = pymupdf.open(stream=data, filetype="pdf")
              print(f"\n######## PDF {nome}: {len(doc)} páginas; meta={ {k: v for k, v in doc.metadata.items() if v} }", flush=True)
              sel = range(len(doc)) if paginas == "todas" else sorted({0, 1, len(doc) - 1} & set(range(len(doc))))
              for pno in sel:
                  page = doc[pno]; W, Hh = page.rect.width, page.rect.height
                  xs, ys = [], []
                  print(f"\n=== página {pno+1}/{len(doc)} ({W:.0f}x{Hh:.0f} pt)")
                  for b in page.get_text("dict")["blocks"]:
                      if b.get("type") == 1:
                          print(f"  [IMAGEM] bbox={[round(v) for v in b['bbox']]}"); continue
                      for l in b.get("lines", []):
                          sp = [s for s in l["spans"] if s["text"].strip()]
                          if not sp: continue
                          for s in sp:
                              xs += [s["bbox"][0], s["bbox"][2]]; ys += [s["bbox"][1], s["bbox"][3]]
                          s0 = sp[0]; t = "".join(s["text"] for s in sp)
                          est = "".join(sorted({("B" if s["flags"] & 16 else "") + ("I" if s["flags"] & 2 else "") + ("^" if s["flags"] & 1 else "") for s in sp}))
                          print(f"  {s0['font'][:26]:26s} {s0['size']:4.1f} [{est:4s}] x={s0['bbox'][0]:4.0f} y={s0['bbox'][1]:4.0f} x1={l['bbox'][2]:4.0f} | {t[:115]}")
                  if xs:
                      print(f"  MARGENS(pt) esq={min(xs):.0f} dir={W-max(xs):.0f} topo={min(ys):.0f} base={Hh-max(ys):.0f}", flush=True)

          def analisa_docx(nome, data):
              d = docx.Document(io.BytesIO(data))
              print(f"\n######## DOCX {nome}")
              for i, s in enumerate(d.sections):
                  cm = lambda v: round(v.cm, 2) if v is not None else None
                  print(f"  seção {i}: página {cm(s.page_width)}x{cm(s.page_height)} cm; margens sup={cm(s.top_margin)} inf={cm(s.bottom_margin)} esq={cm(s.left_margin)} dir={cm(s.right_margin)}; cabeçalho={cm(s.header_distance)} rodapé={cm(s.footer_distance)}")
              for st in d.styles:
                  try:
                      f = st.font; pf = st.paragraph_format
                      if f is not None and (f.name or f.size):
                          print(f"  ESTILO {st.name!r}: fonte={f.name} tam={f.size.pt if f.size else None} negrito={f.bold} itálico={f.italic} alinh={pf.alignment} recuo1={pf.first_line_indent.cm if pf.first_line_indent else None} antes={pf.space_before.pt if pf.space_before else None} depois={pf.space_after.pt if pf.space_after else None} entrelinha={pf.line_spacing}")
                  except Exception:
                      pass
              for p in d.paragraphs:
                  if p.text.strip():
                      runs = [(r.font.name, r.font.size.pt if r.font.size else None, r.bold, r.italic) for r in p.runs[:2]]
                      pf = p.paragraph_format
                      print(f"  [{p.style.name} | alinh={p.alignment} recuo1={pf.first_line_indent.cm if pf.first_line_indent else None} runs={runs}] {p.text[:400]}")
              for ti, t in enumerate(d.tables):
                  print(f"  TABELA {ti}: {len(t.rows)}x{len(t.columns)}; 1ª linha: {[c.text[:30] for c in t.rows[0].cells]}")

          def baixa_arquivo(nome, u):
              if u in VISTOS: return
              VISTOS.add(u)
              r = get(u)
              if r is None or r.status_code != 200: return
              c = r.content
              if c[:4] == b"%PDF":
                  analisa_pdf(nome or u, c, "todas" if N_PDF[0] < 4 else "amostra")
              elif c[:2] == b"PK":
                  try:
                      analisa_docx(nome or u, c)
                  except Exception:
                      z = zipfile.ZipFile(io.BytesIO(c))
                      print("  ZIP:", z.namelist()[:40])
                      for n in z.namelist():
                          if n.lower().endswith((".tex", ".cls", ".sty", ".bst")):
                              print(f"\n---- {n} ----\n" + z.read(n).decode("utf-8", "replace")[:12000])
                          elif n.lower().endswith(".docx"):
                              analisa_docx(n, z.read(n))
                          elif n.lower().endswith(".pdf"):
                              analisa_pdf(n, z.read(n))
              else:
                  print(texto(r.text, 3000))

          def eh_arquivo(u):
              return re.search(r"\.(pdf|docx?|zip|tex|dotx)($|\?)", u, re.I) or "/doc/" in u or "download" in u.lower()

          # 1) normas, prazos e templates (SBSR 2027 e 2025)
          for u in ["https://www.sbsr.com.br/sbsr-2027/page/8162-inicio?lang=pt-br",
                    "https://proceedings.science/cfp/sbsr-2027?lang=pt-br",
                    "https://proceedings.science/cfp/sbsr-2025?lang=pt-br"]:
              r = get(u)
              if r is None: continue
              print(f"\n----- TEXTO {u} -----\n{texto(r.text, 9000)}\n----- fim -----")
              for t, h in links(r):
                  if eh_arquivo(h) or re.search(r"templat|modelo|norma|instru", t + h, re.I):
                      print("  LINK:", t, "->", h)
                      if eh_arquivo(h):
                          baixa_arquivo(t, h)

          # 2) biblioteca online de anais
          r = get("https://2023.sbsr.com.br/biblioteca-online-anais-sbsr/")
          edicoes = []
          if r is not None:
              print(f"\n----- BIBLIOTECA -----\n{texto(r.text, 4000)}\n----- fim -----")
              for t, h in links(r):
                  print("  BIB:", t, "->", h)
                  if re.search(r"20(1[5-9]|2[0-5])|XX|anais|proceedings|marte", t + h, re.I):
                      edicoes.append((t, h))

          # 3) trabalhos indicados pela autora e uma amostra das edições recentes
          alvos = [("referência 1", "http://marte.sid.inpe.br/rep/83LX3pFwXQZ5Jpy/CxGU3"),
                   ("referência 2 (2025)", "http://marte2.sid.inpe.br/rep/sid.inpe.br/marte2/2025/09.17.19.06/capa.htm")]
          recentes = [e for e in edicoes if re.search(r"2025|2023|XXI|XX ", e[0] + e[1])][:4]
          for nome, u in alvos + recentes:
              if N_PDF[0] >= 8: break
              r = get(u)
              if r is None: continue
              if r.content[:4] == b"%PDF":
                  analisa_pdf(nome, r.content); continue
              print(f"\n----- {nome}: {r.url} -----\n{texto(r.text, 2500)}")
              ls = links(r)
              for t, h in ls[:60]:
                  print("   ", t, "->", h)
              cand = [h for _, h in ls if eh_arquivo(h) or re.search(r"mirrorget|capa|\.htm", h, re.I)]
              for h in cand[:6]:
                  if N_PDF[0] >= 8: break
                  if h in VISTOS: continue
                  VISTOS.add(h)
                  r2 = get(h)
                  if r2 is None: continue
                  if r2.content[:4] == b"%PDF":
                      analisa_pdf(h, r2.content, "todas" if N_PDF[0] < 4 else "amostra")
                  else:
                      for t2, h2 in links(r2):
                          if re.search(r"\.pdf($|\?)|/doc/", h2, re.I) and h2 not in VISTOS and N_PDF[0] < 8:
                              baixa_arquivo(t2, h2)
          print(f"\nPDFs analisados: {N_PDF[0]}")
