name: Atualiza cenarios espaciais de Mucum ate 30 m

on:
  push:
    branches: [main]
    paths:
      - 'codigo_python/02_mdt_hand_mancha/gerar_mosaico_mdt.py'
      - 'codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py'
      - 'scripts/refresh_spatial_30m_pages.py'
      - '.github/workflows/refresh-spatial-30m.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-spatial-30m
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mínimo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codigo_python/02_mdt_hand_mancha/
            /scripts/refresh_spatial_30m_pages.py
            /assets/data/mucum_inundacao/
            /pesquisas/mucum-mapa-impacto.html
            /pesquisas/mucum-mapa-margem.html
            /pesquisas/mucum-painel-evacuacao.html
            /mucum_painel_evacuacao.html

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias geoespaciais
        run: pip install numpy scipy rasterio pillow shapely

      # Santa Tereza usa o gerador LiDAR dedicado, com zero da régua em 1,60 m.
      # Este job legado não pode substituir o HAND de campo do rio principal.
      - name: Reconstruir mosaico 2 m de Mucum
        run: python codigo_python/02_mdt_hand_mancha/gerar_mosaico_mdt.py mucum

      - name: Gerar contornos HAND 0-30 m de Mucum
        run: python codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py mucum

      - name: Atualizar impacto, margem e paineis de Mucum
        run: python scripts/refresh_spatial_30m_pages.py mucum

      - name: Conferir cobertura
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          expected = {
              Path('pesquisas/mucum-mapa-impacto.html'): 30.0,
              Path('pesquisas/mucum-mapa-margem.html'): 30.0,
              Path('pesquisas/mucum-painel-evacuacao.html'): 30.0,
          }
          for p, hand_max in expected.items():
              s=p.read_text(encoding='utf-8')
              m=re.search(r'const D=(\{[\s\S]*?\});\n',s)
              assert m, p
              d=json.loads(m.group(1))
              assert float(d['meta']['nivel_max_m']) == hand_max, (p,d['meta'])
              assert float(d['meta']['cobertura_espacial_m']) == 30.0, (p,d['meta'])
              assert 'max="200"' in s, f'velocidade não chega a 200 em {p}'
          print('OK: Mucum com cobertura técnica 30 m; velocidade 200 cm/h; HAND de campo de Santa Tereza preservado')
          PY

      - name: Publicar resultados
        run: |
          git config user.name "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git add assets/data/mucum_inundacao/contornos_mancha.json pesquisas/mucum-mapa-impacto.html pesquisas/mucum-mapa-margem.html pesquisas/mucum-painel-evacuacao.html mucum_painel_evacuacao.html
          git diff --staged --quiet && { echo "sem mudança"; exit 0; }
          git commit -m "bot: recalcula cenarios espaciais ate 30 m [skip ci]"
          for tentativa in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "retry $tentativa"; sleep $((tentativa*3))
          done
          exit 1
