name: Atualiza cenarios espaciais ate 30 m

on:
  push:
    branches: [main]
    paths:
      - 'codigo_python/02_mdt_hand_mancha/gerar_mosaico_mdt.py'
      - 'codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py'
      - 'scripts/refresh_spatial_30m_pages.py'
      - '.github/workflows/refresh-spatial-30m.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-spatial-30m
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias geoespaciais
        run: pip install numpy scipy rasterio pillow shapely

      - name: Reconstruir mosaicos 2 m
        run: |
          python codigo_python/02_mdt_hand_mancha/gerar_mosaico_mdt.py mucum
          python codigo_python/02_mdt_hand_mancha/gerar_mosaico_mdt.py santa_tereza

      - name: Gerar contornos HAND 0-30 m
        run: |
          python codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py mucum
          python codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py santa_tereza

      - name: Atualizar impacto, margem e paineis
        run: python scripts/refresh_spatial_30m_pages.py

      - name: Conferir cobertura
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          for p in [
              Path('pesquisas/mucum-mapa-impacto.html'),
              Path('pesquisas/santa-tereza-mapa-impacto.html'),
              Path('pesquisas/mucum-mapa-margem.html'),
              Path('pesquisas/santa-tereza-mapa-margem.html'),
              Path('pesquisas/mucum-painel-evacuacao.html'),
              Path('pesquisas/santa-tereza-painel-evacuacao.html'),
          ]:
              s=p.read_text(encoding='utf-8')
              m=re.search(r'const D=(\{[\s\S]*?\});\n',s)
              assert m, p
              d=json.loads(m.group(1))
              assert float(d['meta']['nivel_max_m']) == 30.0, (p,d['meta'])
              assert 'max="200"' in s, f'velocidade não chega a 200 em {p}'
          print('OK: cenários 30 m e velocidade 200 cm/h')
          PY

      - name: Publicar resultados
        run: |
          git config user.name "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git add             assets/data/mucum_inundacao/contornos_mancha.json             assets/data/santa_tereza_inundacao/contornos_mancha.json             pesquisas/mucum-mapa-impacto.html             pesquisas/santa-tereza-mapa-impacto.html             pesquisas/mucum-mapa-margem.html             pesquisas/santa-tereza-mapa-margem.html             pesquisas/mucum-painel-evacuacao.html             pesquisas/santa-tereza-painel-evacuacao.html             mucum_painel_evacuacao.html             santa_tereza_painel_evacuacao.html
          git diff --staged --quiet && { echo "sem mudança"; exit 0; }
          git commit -m "bot: recalcula cenarios espaciais ate 30 m [skip ci]"
          for tentativa in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "retry $tentativa"; sleep $((tentativa*3))
          done
          exit 1
