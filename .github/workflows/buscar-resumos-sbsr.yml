name: Buscar resumos SBSR (temporário)

# Workflow temporário: o ambiente de edição não acessa o proceedings.science.
# Baixa páginas e PDFs de trabalhos do SBSR sobre inundação/HAND/LiDAR e
# imprime no log título, autores, resumo, palavras-chave e o início do PDF.
# Nada é gravado no repositório. Remover após o uso.

on:
  workflow_dispatch:
  push:
    branches: [claude/elegant-gauss-fhl22a]
    paths: ['.github/workflows/buscar-resumos-sbsr.yml']

permissions:
  contents: read

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf requests beautifulsoup4
      - name: Baixar e imprimir resumos
        shell: python
        run: |
          import re, json
          from urllib.parse import urljoin
          import requests, pymupdf
          from bs4 import BeautifulSoup

          S = requests.Session()
          S.headers.update({"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                            "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8"})
          B = "https://proceedings.science/"
          URLS = [
            "sbsr-2025/papers/inundacao-de-maio-de-2024-no-rio-grande-do-sul-levantamento-dos-niveis-maximos-d",
            "sbsr-2025/papers/mapeamento-de-areas-suscetiveis-a-inundacao-com-o-modelo-hand-model-no-distrito",
            "sbsr-2025/papers/analise-do-tempo-de-retorno-de-inundacoes-na-cidade-de-goias-usando-o-modelo-de",
            "sbsr-2025/papers/mancha-de-inundacao-para-eldorado-do-sulrs-e-guaibars-por-meio-de-indices-espect",
            "sbsr-2025/papers/geomorphological-factors-driving-flood-susceptibility-in-recife-identifying-high",
            "sbsr-2023/papers/avaliacao-de-diferentes-modelos-digitais-de-elevacao-e-terreno-para-classificaca",
            "sbsr-2023/papers/simulacao-de-area-suscetivel-a-inundacao-em-regiao-costeira-empregando-dados-fot",
            "sbsr-2023/trabalhos/cenarios-de-inundacao-em-areas-costeiras-provocadas-pelo-aquecimento-global-da-t",
            "sbsr-2023/papers/reducao-do-efeito-da-vegetacao-em-modelos-digitais-de-superficie-gratuitos-utili",
            "sbsr-2019/papers/avaliacao-do-modelo-digital-de-elevacao-topodata-a-partir-de-dados-lidar-em-uma",
            "sbsr-2019/papers/evento-de-inundacao-em-itaquirs-no-rio-uruguai",
          ]

          def limpa(t):
              return re.sub(r"\s+", " ", t).strip()

          def pdf_inicio(nome, data):
              doc = pymupdf.open(stream=data, filetype="pdf")
              print(f"  PDF: {len(doc)} páginas; página 1 {doc[0].rect.width:.0f}x{doc[0].rect.height:.0f} pt")
              txt = ""
              for p in doc[:2]:
                  txt += p.get_text("text") + "\n"
              i = max(txt.find("Abstract"), txt.find("ABSTRACT"), txt.find("Resumo"), txt.find("RESUMO"))
              print("  PDF-TEXTO-INICIO >>>")
              print(txt[:5500])
              print("  <<< PDF-TEXTO-FIM")
              for b in doc[0].get_text("dict")["blocks"][:40]:
                  for l in b.get("lines", []):
                      sp = [s for s in l["spans"] if s["text"].strip()]
                      if sp:
                          s0 = sp[0]
                          print(f"   fmt {s0['font'][:24]:24s} {s0['size']:4.1f} {'B' if s0['flags'] & 16 else ' '}{'I' if s0['flags'] & 2 else ' '} x={s0['bbox'][0]:4.0f} | {''.join(s['text'] for s in sp)[:70]}")

          # 2ª rodada: relatório do SGB e espelho do INPE dos Anais 2025
          URLS = []
          def get(u):
              try:
                  r = S.get(u, timeout=90, allow_redirects=True)
                  print(f"GET {u} -> {r.status_code} {r.headers.get('content-type')} {len(r.content)} final={r.url}", flush=True)
                  return r
              except Exception as e:
                  print("ERRO", u, e, flush=True)

          r = get("https://rigeo.sgb.gov.br/server/api/core/bitstreams/fc1b8a76-deae-4913-96de-3b25cd3f9845/content")
          if r is not None and r.content[:4] == b"%PDF":
              doc = pymupdf.open(stream=r.content, filetype="pdf")
              print("SGB-PDF", len(doc), "páginas", doc.metadata)
              for pno in range(min(3, len(doc))):
                  print(f"--- SGB página {pno+1} ---\n" + doc[pno].get_text("text")[:4000])
              for pno in range(len(doc)):
                  t = doc[pno].get_text("text")
                  for chave in ["86472600", "Santa Tereza", "SANTA TEREZA"]:
                      j = t.find(chave)
                      if j >= 0:
                          print(f"SGB-ACHADO pág {pno+1} '{chave}': {limpa(t[max(0, j-600):j+900])}")
                          break

          for u in ["http://marte2.sid.inpe.br/rep/sid.inpe.br/marte2/2025/09.17.19.06/capa.htm",
                    "http://marte2.sid.inpe.br/rep/sid.inpe.br/marte2/2025/09.17.19.06"]:
              r = get(u)
              if r is None or r.status_code != 200:
                  continue
              soup = BeautifulSoup(r.text, "html.parser")
              print("CAPA-TEXTO", limpa(soup.get_text(" "))[:2500])
              ls = [(limpa(a.get_text(" "))[:80], urljoin(r.url, a["href"])) for a in soup.find_all(["a", "frame", "iframe"], href=True)]
              ls += [("frame", urljoin(r.url, f["src"])) for f in soup.find_all(["frame", "iframe"], src=True)]
              for t, h in ls[:80]:
                  print("  LINK", t, "->", h)
              break

          # PDFs dos anais 2025 no INPE: tenta achar os trabalhos por palavras do título
          alvos = {"marcuzzo": "NÍVEIS MÁXIMOS", "hand": "Cacau Pir", "eldorado": "ELDORADO"}
          vistos = set()
          fila = [h for _, h in ls] if 'ls' in dir() else []
          achados = 0
          k = 0
          while k < len(fila) and k < 120:
              h = fila[k]; k += 1
              if h in vistos or not h.startswith("http"):
                  continue
              vistos.add(h)
              r2 = get(h)
              if r2 is None or r2.status_code != 200:
                  continue
              if r2.content[:4] == b"%PDF":
                  doc = pymupdf.open(stream=r2.content, filetype="pdf")
                  print("PDF-ANAIS", h, len(doc), "páginas")
                  for pno in range(min(2, len(doc))):
                      print(doc[pno].get_text("text")[:3000])
                  achados += 1
                  if achados >= 2:
                      break
                  continue
              s2 = BeautifulSoup(r2.text, "html.parser")
              txt = limpa(s2.get_text(" "))
              print("SUBPAG", h, "::", txt[:600])
              for a in s2.find_all("a", href=True):
                  tt = limpa(a.get_text(" "))
                  hh = urljoin(r2.url, a["href"])
                  if any(v.lower() in tt.lower() for v in alvos.values()) or re.search(r"\.pdf($|\?)", hh, re.I):
                      print("   CAND", tt[:100], "->", hh)
                      if hh not in fila:
                          fila.append(hh)

