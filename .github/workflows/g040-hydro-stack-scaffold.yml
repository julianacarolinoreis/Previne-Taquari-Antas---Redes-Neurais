name: G040 hydro stack scaffold

on:
  pull_request:
    paths:
      - "config/g040_hydro_stack_v1.json"
      - "config/g040_stage2_execution_v1.json"
      - "docs/arquitetura_g040_sma_mgb_ras.md"
      - "scripts/build_g040_hydro_stack_scaffold.py"
      - "scripts/test_g040_hydro_stack_scaffold.py"
      - "scripts/g040_rain_grid.py"
      - "scripts/build_mucum_observed_multistation.py"
      - "scripts/build_g040_observed_rain_forcing.py"
      - "scripts/build_g040_ifs_interval_forcing.py"
      - "scripts/build_g040_merged_rain_forcing.py"
      - "scripts/test_g040_rain_forcing_contract.py"
      - "scripts/build_g040_sma_branch_template.py"
      - "scripts/build_g040_mgb_input_readiness.py"
      - "scripts/build_g040_hec_ras_pilot_readiness.py"
      - "scripts/build_g040_assimilation_readiness.py"
      - "scripts/build_g040_ensemble_readiness.py"
      - "scripts/build_g040_stage2_master.py"
      - "scripts/test_g040_stage2_master.py"
      - "scripts/run_hec_hms_g040_e1_hindcast.py"
      - "scripts/test_g040_e1_contract.py"
      - "scripts/test_g040_legacy_meteorologic_assignment.py"
      - "assets/data/g040_hydro_stack/project_source_inventory_latest.json"
      - "assets/data/g040_hydro_stack/met_forcing_source_contract_latest.json"
      - "assets/data/hec_hms_g040_full_basin/original_145_meteorologic_assignment_latest.csv"
      - "assets/data/hec_hms_g040_full_basin/original_145_meteorologic_assignment_audit_latest.json"
      - ".github/workflows/g040-hydro-stack-scaffold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test dependencies
        run: pip install --disable-pip-version-check numpy shapely

      - name: Hydro stack unit tests
        run: python -B scripts/test_g040_hydro_stack_scaffold.py

      - name: Rain forcing contract tests
        run: python -B scripts/test_g040_rain_forcing_contract.py

      - name: Compile research builders
        run: python -m py_compile scripts/g040_rain_grid.py scripts/build_mucum_observed_multistation.py scripts/build_g040_observed_rain_forcing.py scripts/build_g040_ifs_interval_forcing.py scripts/build_g040_merged_rain_forcing.py scripts/build_g040_sma_branch_template.py scripts/build_g040_mgb_input_readiness.py scripts/build_g040_hec_ras_pilot_readiness.py scripts/build_g040_assimilation_readiness.py scripts/build_g040_ensemble_readiness.py scripts/build_g040_stage2_master.py scripts/run_hec_hms_g040_e1_hindcast.py

      - name: Legacy HEC meteorologic assignment audit
        run: python -B scripts/test_g040_legacy_meteorologic_assignment.py

      - name: G040 E1 contract tests
        run: python -B scripts/test_g040_e1_contract.py

      - name: Build source readiness and Stage-2 master
        run: |
          python -B scripts/build_g040_sma_branch_template.py
          python -B scripts/build_g040_mgb_input_readiness.py
          python -B scripts/build_g040_hec_ras_pilot_readiness.py
          python -B scripts/build_g040_assimilation_readiness.py
          python -B scripts/build_g040_ensemble_readiness.py
          python -B scripts/build_g040_stage2_master.py
          python -B scripts/test_g040_stage2_master.py

      - name: Check persisted full-basin dependency
        shell: bash
        run: |
          if [ -f assets/data/hec_hms_g040_full_basin/full_basin_architecture_latest.json ]; then
            python -B scripts/build_g040_hydro_stack_scaffold.py
            echo "Full G040 scaffold generated."
          else
            echo "::warning::G040 full-basin architecture is not persisted on this ref yet."
            echo "Run the HEC G040 full-basin architecture workflow first; scaffold generation is correctly blocked until then."
          fi
