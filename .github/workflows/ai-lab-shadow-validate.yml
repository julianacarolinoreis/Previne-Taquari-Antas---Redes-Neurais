name: PREVINE AI Lab - validar runtime sombra

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "PREVINE AI Lab - treinamento automatico"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: previne-ai-lab-shadow-runtime
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ai_lab_auto_train.py
            scripts/ai_lab_temporal_train.py
            scripts/test_ai_lab_shadow_numpy_inference.py
            previne/robo/ai_lab_shadow_tcn.py
            assets/data/ai_lab
            assets/audit_workbooks
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.5.3" "openpyxl==3.1.5" "scikit-learn==1.9.1" "xgboost==3.4.1"
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Cross-check NumPy shadow runtime
        run: python -B scripts/test_ai_lab_shadow_numpy_inference.py

      - name: Publish runtime validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ai_lab/shadow/shadow_runtime_validation_latest.json
          if git diff --cached --quiet; then
            echo "No runtime validation changes."
          else
            git commit -m "Validate AI Lab NumPy shadow runtime"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            exit 1
          fi
