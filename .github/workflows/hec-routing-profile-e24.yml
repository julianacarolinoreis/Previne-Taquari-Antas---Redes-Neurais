name: HEC routing E24 · perfil de trechos

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hec-routing-profile-e24.yml"
      - "scripts/search_hec_hms_reach_routing_e24.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hec-routing-profile-e24
  cancel-in-progress: true

jobs:
  routing-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Baixa HEC-HMS 4.13 oficial
        if: steps.cache-hec.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 \
            -o /tmp/HEC-HMS-4.13-linux64.tar.gz \
            https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Busca controlada de routing E24
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          python -B scripts/search_hec_hms_reach_routing_e24.py "$HEC_SH"

      - name: Valida saída
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("assets/data/hec_hms_integrated_taquari_antas/routing_profile_e24/routing_profile_e24_latest.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["best"] is not None
          assert d["candidate_count"] >= 50
          print("baseline:", d["baseline"])
          print("best:", d["best"])
          print("delta:", d["improvement_best_minus_baseline"])
          PY

      - name: Publica resultados do experimento
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-routing-bot"
          git config user.email "previne-hec-routing-bot@users.noreply.github.com"
          git add -- assets/data/hec_hms_integrated_taquari_antas/routing_profile_e24
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "exp: resultados routing E24 [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            git rebase --abort || true
            echo "Conflito inesperado ao publicar resultados."
            exit 1
          done
          exit 1
