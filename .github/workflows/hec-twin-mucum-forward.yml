name: HEC twin Muçum forward ~5d

# Robô de pesquisa: campo IFS espacial + gêmeo HEC legado + plataforma Pages.
# O ΔN legado não é promovido como previsão espacial enquanto o modelo ainda usa proxies pontuais.
# Não toca RNA. Não é alerta oficial.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hec-twin-mucum-forward.yml"
      - "previsao_ao_vivo_mucum.json"
      - "previsao_ao_vivo.json"
      - "scripts/build_spatial_ifs_mucum.py"
      - "scripts/build_hec_twin_ifs_forcing_5d.py"
      - "scripts/build_hec_twin_ifs_spatial_forcing_5d.py"
      - "scripts/build_mucum_twin_subbasin_zones.py"
      - "assets/data/estudo_bacia_taquari_antas/mucum_twin_subbasin_zones.geojson"
      - "scripts/build_mucum_observed_multistation.py"
      - "scripts/build_hec_hms_spatial_forecast_mucum.py"
      - "scripts/postprocess_hec_hms_spatial_forecast_mucum.py"
      - "scripts/select_hec_hms_live_candidate.py"
      - "scripts/run_hec_hms_live_candidates.sh"
      - "scripts/calibrate_hec_hms_live_event.py"
      - "scripts/run_hec_twin_mucum_forward_5d.py"
      - "scripts/hec_twin_nested_v17.py"
      - "scripts/hec_twin_mucum_bacia_calibracao.py"
      - "scripts/run_hec_twin_stz_mucum_calibrate.py"
      - "scripts/build_plataforma_hec_twin_mucum.py"
      - "scripts/build_plataforma_hec_twin_mucum_v3.py"
      - "scripts/plataforma_hec_twin_mucum_ui.py"
      - "scripts/plataforma_hec_twin_mucum_ui_v3.py"
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hec-twin-mucum-forward
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências do campo espacial
        run: pip install --disable-pip-version-check shapely pyproj matplotlib

      - name: Observado multirrede · chuva + vazão desde 26/09
        run: python -B scripts/build_mucum_observed_multistation.py

      - name: IFS espacial · bacia contribuinte até Muçum
        run: python -B scripts/build_spatial_ifs_mucum.py

      - name: IFS forcing espacial · sub-bacias do gêmeo HEC
        run: python -B scripts/build_hec_twin_ifs_spatial_forcing_5d.py

      - name: Gêmeo HEC Muçum ~5d · chuva espacial
        run: python -B scripts/run_hec_twin_mucum_forward_5d.py --forcing assets/data/estudo_bacia_taquari_antas/hec_twin_ifs_spatial_forcing_5d_latest.json

      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Baixa HEC-HMS 4.13 oficial
        if: steps.cache-hec.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 \
            -o /tmp/HEC-HMS-4.13-linux64.tar.gz \
            https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec
          find .hec -maxdepth 3 -type f -name 'hec-hms.sh' -print

      - name: Executa candidatos HEC-HMS 4.13 · estado observado
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          if [ -z "$HEC_SH" ]; then
            echo "hec-hms.sh não encontrado"
            find .hec -maxdepth 3 -type f | head -100
            exit 1
          fi
          bash scripts/run_hec_hms_live_candidates.sh "$HEC_SH"

      - name: Calibra HEC-HMS no evento atual · 26/09→t0
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          if [ -z "$HEC_SH" ]; then
            echo "hec-hms.sh não encontrado"
            exit 1
          fi
          python -B scripts/calibrate_hec_hms_live_event.py "$HEC_SH"

      - name: Plataforma HEC/REC v3
        run: python -B scripts/build_plataforma_hec_twin_mucum_v3.py

      - name: Smoke schema forward + plataforma
        run: |
          python -B -m unittest scripts.test_hec_twin_mucum_forward_5d scripts.test_plataforma_hec_twin_mucum -v

      - name: Publica artefatos HEC
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-bot"
          git config user.email "previne-hec-bot@users.noreply.github.com"

          git restore --             assets/data/estudo_bacia_taquari_antas/decisao_previsao_nivel_multi_alvo_latest.json             assets/data/estudo_bacia_taquari_antas/README.md || true

          git add --             assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_latest.json             assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_rain_hourly.csv             assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_flow_hourly.csv             assets/data/estudo_bacia_taquari_antas/spatial_ifs_mucum             assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum             assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_selection_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_live_event_calibration_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_live_event_calibration_candidates.csv             assets/data/estudo_bacia_taquari_antas/hec_hms_live_event_calibrated_forecast_latest.json             assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_calibration_snapshot.json             assets/data/estudo_bacia_taquari_antas/hec_twin_ifs_spatial_forcing_5d_latest.json             assets/data/estudo_bacia_taquari_antas/hec_twin_mucum_forward_5d_latest.json             assets/data/estudo_bacia_taquari_antas/hec_twin_mucum_forward_5d.html             assets/data/estudo_bacia_taquari_antas/hec_twin_mucum_forward_5d             assets/data/estudo_bacia_taquari_antas/plataforma_hec_twin_mucum_latest.json             assets/data/estudo_bacia_taquari_antas/plataforma_hec_twin_mucum.html             plataforma_hec_twin.html

          if git diff --cached --quiet; then
            echo "Sem mudança neste ciclo HEC."
            exit 0
          fi

          git commit -m "bot: chuva espacial + plataforma HEC Muçum v3 [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push ocupado; sincronizando (tentativa ${attempt}/5)."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              pip install --disable-pip-version-check shapely pyproj matplotlib
              python -B scripts/build_mucum_observed_multistation.py
              python -B scripts/build_spatial_ifs_mucum.py
              python -B scripts/build_spatial_ifs_mucum.py
              python -B scripts/build_hec_twin_ifs_spatial_forcing_5d.py
              python -B scripts/run_hec_twin_mucum_forward_5d.py --forcing assets/data/estudo_bacia_taquari_antas/hec_twin_ifs_spatial_forcing_5d_latest.json
              HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
              bash scripts/run_hec_hms_live_candidates.sh "$HEC_SH"
              python -B scripts/calibrate_hec_hms_live_event.py "$HEC_SH"
              python -B scripts/build_plataforma_hec_twin_mucum_v3.py
              git add --                 assets/data/estudo_bacia_taquari_antas/spatial_ifs_mucum                 assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum                 assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json                 assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_selection_latest.json                 assets/data/estudo_bacia_taquari_antas/hec_hms_live_event_calibration_latest.json                 assets/data/estudo_bacia_taquari_antas/hec_hms_live_event_calibration_candidates.csv                 assets/data/estudo_bacia_taquari_antas/hec_hms_live_event_calibrated_forecast_latest.json                 assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_calibration_snapshot.json                 assets/data/estudo_bacia_taquari_antas/hec_twin_ifs_forcing_5d_latest.json                 assets/data/estudo_bacia_taquari_antas/hec_twin_mucum_forward_5d_latest.json                 assets/data/estudo_bacia_taquari_antas/hec_twin_mucum_forward_5d.html                 assets/data/estudo_bacia_taquari_antas/hec_twin_mucum_forward_5d                 assets/data/estudo_bacia_taquari_antas/plataforma_hec_twin_mucum_latest.json                 assets/data/estudo_bacia_taquari_antas/plataforma_hec_twin_mucum.html                 plataforma_hec_twin.html
              if git diff --cached --quiet; then
                echo "Artefatos já publicados por outra execução."
                exit 0
              fi
              git commit -m "bot: chuva espacial + plataforma HEC Muçum v3 [skip ci]"
            fi
            sleep $((attempt * 2))
          done
          echo "Não foi possível publicar após 5 tentativas."
          exit 1
