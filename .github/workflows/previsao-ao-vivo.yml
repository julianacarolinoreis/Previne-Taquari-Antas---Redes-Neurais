name: Previsao ao vivo - Santa Tereza

on:
  push:
    branches: [main]
    paths:
      # Alterações no próprio robô/painel precisam gerar um snapshot novo
      # imediatamente; não esperar o próximo disparo best-effort do scheduler.
      - 'previne/robo/gerar_previsao_ao_vivo.py'
      - 'previne/robo/fontes_chuva_8h.py'
      - 'previne/assets/mat/**'
      - 'assets/mat/**'
      - 'assets/audit_workbooks/**'
      - 'assets/previsao_panorama.js'
      - 'scripts/validar_previsao_ao_vivo.py'
      - 'scripts/test_previsao_ao_vivo_schema.py'
      - '.github/workflows/previsao-ao-vivo.yml'
  schedule:
    # Plantao frequente de Santa Tereza. O GitHub trata schedule como
    # best-effort; o painel exibe a idade real da última execução.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Atualiza feed meteorológico de Santa Tereza"
      - "Chuvas horarias (ANA + INMET + CEMADEN)"
      - "Contexto automático da pesquisa da bacia"
    types:
      - completed

jobs:
  prever:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Uma consulta ANA presa não pode deixar o robô indefinidamente em execução.
    timeout-minutes: 8
    concurrency:
      group: previsao-ao-vivo-santa-tereza
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0

      - name: Gerar e publicar previsao ao vivo - Santa Tereza
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"

          git pull --rebase --autostash origin main
          python -B -m py_compile \
            previne/robo/fontes_chuva_8h.py \
            previne/robo/gerar_previsao_ao_vivo.py \
            scripts/test_stz_8h_excel_mother_contract.py \
            scripts/test_previsao_ao_vivo_schema.py \
            scripts/validar_previsao_ao_vivo.py
          # Teste estático do contrato do modelo antes de consultar a rede.
          python -B -m unittest scripts.test_stz_8h_excel_mother_contract
          # Gera primeiro o schema corrente; assim uma futura migração de schema
          # não fica bloqueada por um JSON antigo ainda presente no repositório.
          timeout --signal=TERM --kill-after=20s 240s python previne/robo/gerar_previsao_ao_vivo.py
          python -B scripts/validar_previsao_ao_vivo.py
          python -B -m unittest scripts.test_previsao_ao_vivo_schema

          git add previsao_ao_vivo.json historico_previsoes_ao_vivo.json
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
          else
            git commit -m "bot: atualiza previsao_ao_vivo.json [skip ci]"
            publicado=0
            for tentativa in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                publicado=1
                break
              fi
              echo "push rejeitado (tentativa ${tentativa}), refazendo rebase..."
              sleep 3
            done
            if [ "$publicado" != "1" ]; then
              echo "falha ao publicar apos retries"
              exit 1
            fi
          fi
