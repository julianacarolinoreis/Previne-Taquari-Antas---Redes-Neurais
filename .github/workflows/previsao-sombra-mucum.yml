# RNAs v2 de Muçum (4 h e 8 h com estações a montante) em SOMBRA.
# Não altera o feed público previsao_ao_vivo_mucum.json: grava somente
# previsao_sombra_mucum.json e o histórico permanente para avaliação.
name: Previsao em sombra - Mucum v2

on:
  push:
    branches: [main]
    paths:
      - 'codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py'
      - 'assets/data/mucum_modelos_sombra.json'
      - 'assets/mat/sombra/**'
      - 'scripts/test_previsao_sombra_mucum.py'
      - '.github/workflows/previsao-sombra-mucum.yml'
  schedule:
    # De hora em hora, longe dos minutos usados pelos robôs principais.
    - cron: '41 * * * *'
  workflow_dispatch:

jobs:
  sombra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: previsao-sombra-mucum
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0
      - name: Testes e previsao em sombra
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git pull --rebase --autostash origin main
          python -B -m unittest scripts.test_previsao_sombra_mucum
          timeout --signal=TERM --kill-after=20s 900s python -B codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py
          git add previsao_sombra_mucum.json historico_previsao_sombra_mucum.jsonl
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
            exit 0
          fi
          git commit -m "bot: previsao em sombra Mucum v2 [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push rejeitado (${tentativa}), rebase..."
            sleep 3
          done
          echo "falha ao publicar a sombra"
          exit 1
