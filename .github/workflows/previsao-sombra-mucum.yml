# RNAs v2 de Muçum e de Santa Tereza (4 h e 8 h com estações a montante) em SOMBRA.
# Não altera os feeds públicos: grava somente previsao_sombra_mucum.json,
# previsao_sombra_santa_tereza.json e os históricos permanentes para avaliação.
name: Previsao em sombra - Mucum e Santa Tereza v2

on:
  push:
    branches: [main]
    paths:
      - 'codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py'
      - 'assets/data/mucum_modelos_sombra.json'
      - 'assets/data/santa_tereza_modelos_sombra.json'
      - 'assets/mat/sombra_mucum_v2/**'
      - 'assets/mat/sombra_santa_tereza_v2/**'
      - 'scripts/test_previsao_sombra_mucum.py'
      - '.github/workflows/previsao-sombra-mucum.yml'
  schedule:
    # De hora em hora, longe dos minutos usados pelos robôs principais.
    - cron: '41 * * * *'
  workflow_dispatch:

jobs:
  sombra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: previsao-sombra-mucum
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0
      - name: Testes e previsao em sombra
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git pull --rebase --autostash origin main
          python -B -m unittest scripts.test_previsao_sombra_mucum
          # cada alvo é independente: falha em um não impede o outro
          timeout --signal=TERM --kill-after=20s 600s python -B codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py || echo "falha na sombra de Muçum"
          timeout --signal=TERM --kill-after=20s 600s python -B codigo_python/01_previsao_ao_vivo/gerar_previsao_sombra_mucum.py --contrato assets/data/santa_tereza_modelos_sombra.json || echo "falha na sombra de Santa Tereza"
          for f in previsao_sombra_mucum.json historico_previsao_sombra_mucum.jsonl previsao_sombra_santa_tereza.json historico_previsao_sombra_santa_tereza.jsonl; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
            exit 0
          fi
          git commit -m "bot: previsao em sombra Mucum e Santa Tereza v2 [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push rejeitado (${tentativa}), rebase..."
            sleep 3
          done
          echo "falha ao publicar a sombra"
          exit 1
