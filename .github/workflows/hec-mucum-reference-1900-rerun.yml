# refresh chat 2026-09-29 10:12 BRT — FINAL DIRECT ECMWF IFS 06Z spatial throttled 3h
name: HEC Mucum reference 28-09 19h rerun

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hec-mucum-reference-1900-rerun.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hec-mucum-reference-1900-rerun
  cancel-in-progress: true

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
          pip install --disable-pip-version-check shapely pyproj matplotlib numpy attrs cffi findlibs
          pip install --disable-pip-version-check --no-deps eccodes==2.48.0

      - name: Observado multirrede atualizado
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: ECMWF IFS 06Z espacial DIRETO · GRIB Open Data
        run: python -B scripts/build_spatial_ifs_mucum_direct.py

      - name: Confirma ciclo 06Z antes do HEC
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/data/estudo_bacia_taquari_antas/spatial_ifs_mucum/spatial_ifs_mucum_latest.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          cycle=(d.get("source") or {}).get("cycle_time_utc")
          print("ECMWF_CYCLE_TIME_UTC="+str(cycle))
          if cycle != "2026-09-29T06:00:00Z":
              raise SystemExit(f"rodada incorreta: {cycle}; esperado 2026-09-29T06:00:00Z")
          PY

      - name: Cache HEC-HMS
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Baixa HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 \
            -o /tmp/HEC-HMS-4.13-linux64.tar.gz \
            https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Mantem calibracao correta e assimila apenas o estado inicial
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          mkdir -p /tmp/hec_ref_grid
          for M in 0.60; do
            echo "=== initial_flow_multiplier=$M ==="
            export HEC_PARAM_EVENT=E28
            export HEC_INITIAL_LOSS_MM=20
            export HEC_CONSTANT_LOSS_MM_H=3
            export HEC_TC_H=25
            export HEC_STORAGE_H=20
            export HEC_RECESSION_DAILY=0.9
            export HEC_INITIAL_FLOW_MULTIPLIER="$M"
            python -B scripts/build_hec_hms_spatial_forecast_mucum.py
            rm -f assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/hec_output_values.csv
            "$HEC_SH" -s assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/project/run_forecast.script
            python -B scripts/postprocess_hec_hms_spatial_forecast_mucum.py
            cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json "/tmp/hec_ref_grid/result_$M.json"
            cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/primary_series.csv "/tmp/hec_ref_grid/series_$M.csv"
          done

      - name: Seleciona somente o estado que casa com o observado
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path("assets/data/estudo_bacia_taquari_antas")
          cand=[]
          for p in Path("/tmp/hec_ref_grid").glob("result_*.json"):
              d=json.loads(p.read_text(encoding="utf-8"))
              v=d.get("validation") or {}
              err=v.get("stage_error_at_t0_cm")
              if err is None:
                  continue
              mult=float(p.stem.split("_",1)[1])
              cand.append((abs(float(err)),mult,float(err),p,d))
          if not cand:
              raise SystemExit("sem candidatos validos")
          cand.sort()
          _,mult,err,p,d=cand[0]
          d["rerun_reference"]={
              "reference":"calibracao 28/09 ~19h: NSE 0.78103; RMSE 0.52414 m",
              "frozen_hydrologic_parameters":{
                  "seed_event":"E28",
                  "initial_loss_mm":20.0,
                  "constant_loss_mm_h":3.0,
                  "tc_h":25.0,
                  "storage_h":20.0,
                  "recession_constant_daily":0.9
              },
              "state_only_assimilation":{
                  "method":"estado inicial selecionado em 0.60: menor ajuste que passou as guardas de validacao mantendo a calibracao estrutural congelada",
                  "selected_initial_flow_multiplier":mult,
                  "stage_error_at_t0_cm":err,
                  "visual_stage_shift":False
              },
              "forcing":"chuva observada multirrede ate t0 + ECMWF/IFS mais recente apos t0"
          }
          out=root/"hec_mucum_reference_1900_rerun_latest.json"
          out.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          shutil.copyfile(Path("/tmp/hec_ref_grid")/f"series_{mult:.2f}.csv",
                          root/"hec_mucum_reference_1900_rerun_primary_series.csv")
          print(json.dumps({
            "selected_initial_flow_multiplier":mult,
            "stage_error_at_t0_cm":err,
            "observed_stage_cm":(d.get("current_state") or {}).get("stage_cm"),
            "summary":d.get("summary"),
            "validation":d.get("validation")
          },ensure_ascii=False))
          PY

      - name: Publica artefato separado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-reference-bot"
          git config user.email "previne-hec-reference-bot@users.noreply.github.com"
          git add -- \
            assets/data/estudo_bacia_taquari_antas/mucum_observed_multistation_latest.json \
            assets/data/estudo_bacia_taquari_antas/spatial_ifs_mucum/spatial_ifs_mucum_latest.json \
            assets/data/estudo_bacia_taquari_antas/hec_mucum_reference_1900_rerun_latest.json \
            assets/data/estudo_bacia_taquari_antas/hec_mucum_reference_1900_rerun_primary_series.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: HEC Mucum referencia com observado + ECMWF e estado assimilado [skip ci]"
          git restore --worktree . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git fetch origin main
            if git rebase origin/main; then continue; fi
            git rebase --abort || true
            exit 1
          done
          exit 1
