name: G040 HEC branch structural skeleton

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_g040_hec_branch_skeleton.py"
      - ".github/workflows/g040-hec-branch-skeleton.yml"
      - "assets/data/hec_hms_g040_full_basin/whole_basin_bho6_topology_latest.json"
      - "assets/data/hec_hms_g040_full_basin/whole_basin_bho6_network.geojson"
      - "assets/data/hec_hms_g040_full_basin/whole_basin_incremental_area_budget_latest.json"
      - "assets/data/hec_hms_g040_full_basin/whole_basin_boundary_scenarios_latest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g040-hec-branch-skeleton
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build structural HEC graph
        run: python -B scripts/build_g040_hec_branch_skeleton.py
      - name: Audit skeleton
        shell: bash
        run: |
          python - <<'PY'
          import json
          p="assets/data/hec_hms_g040_full_basin/whole_basin_hec_branch_skeleton_latest.json"
          j=json.load(open(p,encoding="utf-8"))
          print("STATUS:",j["status"])
          print("COUNTS:",j["counts"])
          print("CURRENT SCENARIO:",j["current_boundary_scenario"])
          print("LENGTH CLOSURE:",j["audits"]["all_reach_lengths_close"])
          print("GATES:",j["gates_before_executable_hec"])
          PY
      - name: Publish skeleton
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-g040-hec-skeleton-bot"
          git config user.email "previne-g040-hec-skeleton-bot@users.noreply.github.com"
          BASE="assets/data/hec_hms_g040_full_basin"
          cp "$BASE/whole_basin_hec_branch_skeleton_latest.json" /tmp/
          cp "$BASE/whole_basin_hec_branch_edges.csv" /tmp/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/whole_basin_hec_branch_skeleton_latest.json "$BASE/"
            cp /tmp/whole_basin_hec_branch_edges.csv "$BASE/"
            git add -- "$BASE/whole_basin_hec_branch_skeleton_latest.json" "$BASE/whole_basin_hec_branch_edges.csv"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "bot: update G040 HEC branch skeleton [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
