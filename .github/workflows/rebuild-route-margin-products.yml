name: Regenera margem e impacto ate 30 m

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py'
      - 'scripts/rebuild_route_margin_products.py'

permissions:
  contents: write

concurrency:
  group: rebuild-route-margin-products
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias geoespaciais
        run: python -m pip install --disable-pip-version-check numpy scipy rasterio shapely

      - name: Validar scripts
        run: |
          python -m py_compile codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py
          python -m py_compile codigo_python/09_rota_fuga/gerar_fila_cidade.py
          python -m py_compile scripts/rebuild_route_margin_products.py

      - name: Regenerar contornos HAND vetoriais
        run: |
          python codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py santa_tereza
          python codigo_python/02_mdt_hand_mancha/gerar_contornos_vetoriais.py mucum

      - name: Regenerar exposicao e cotas de margem
        run: |
          python codigo_python/09_rota_fuga/gerar_fila_cidade.py
          python scripts/rebuild_route_margin_products.py

      - name: Publicar produtos
        shell: bash
        run: |
          git config user.name 'previne-route-bot'
          git config user.email 'previne-route-bot@users.noreply.github.com'
          git add             assets/data/santa_tereza_inundacao/contornos_mancha.json             assets/data/mucum_inundacao/contornos_mancha.json             assets/data/rota_fuga/fila_cidade_santa_tereza.json             assets/data/rota_fuga/fila_cidade_mucum.json             pesquisas/santa-tereza-mapa-margem.html             pesquisas/mucum-mapa-margem.html             pesquisas/santa-tereza-mapa-impacto.html             pesquisas/mucum-mapa-impacto.html             pesquisas/santa-tereza-painel-evacuacao.html             pesquisas/mucum-painel-evacuacao.html             santa_tereza_painel_evacuacao.html             mucum_painel_evacuacao.html
          if git diff --cached --quiet; then
            echo 'Nada a publicar.'
            exit 0
          fi
          git commit -m 'bot: amplia margem e impacto para cenarios de regua ate 30 m [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push ocupado; nova tentativa ${attempt}/5"
            sleep $((attempt * 3))
          done
          exit 1
