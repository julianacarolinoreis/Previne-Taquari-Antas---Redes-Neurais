name: HEC Muçum routed fast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hec-mucum-routed-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hec-mucum-routed-fast-v1
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            assets/data/estudo_bacia_taquari_antas
            assets/data/hec_hms_spatialized_mucum
            previsao_ao_vivo_mucum.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --disable-pip-version-check shapely pyproj matplotlib numpy

      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 -o /tmp/HEC-HMS-4.13-linux64.tar.gz https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Routed focused calibration
        shell: bash
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          python -B scripts/run_hec_hms_mucum_routed_fast.py "$HEC_SH"

      - name: Publish routed result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-routed-bot"
          git config user.email "previne-hec-routed-bot@users.noreply.github.com"
          git add --             assets/data/estudo_bacia_taquari_antas/hec_hms_routed_fast_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json             assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/primary_series.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: HEC Muçum routed fast [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
