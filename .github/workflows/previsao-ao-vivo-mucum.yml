name: Previsao ao vivo - Mucum

on:
  push:
    branches: [main]
    paths:
      # Mudanças no robô/panorama precisam produzir um snapshot novo
      # imediatamente, sem esperar o scheduler best-effort.
      - 'codigo_python/01_previsao_ao_vivo/gerar_previsao_ao_vivo_mucum.py'
      - 'assets/data/mucum_modelo_inputs.json'
      - 'assets/data/mucum_modelos_ao_vivo.json'
      - 'assets/mat/**'
      - 'assets/audit_workbooks/**'
      - 'assets/previsao_panorama.js'
      - 'scripts/validar_previsao_ao_vivo_mucum.py'
      - 'scripts/test_previsao_ao_vivo_mucum_schema.py'
      - '.github/workflows/previsao-ao-vivo-mucum.yml'
  schedule:
    # Recuperacao/bootstrap. O GitHub trata schedule como best-effort;
    # o encadeamento repository_dispatch mantem o ciclo depois que ele inicia.
    # O deslocamento evita o minuto exato de virada da hora, mais congestionado.
    - cron: '5-59/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types:
      - previne-mucum-live
  workflow_run:
    workflows:
      - "Atualiza feed meteorológico de Muçum"
      - "Chuvas horarias (ANA + INMET + CEMADEN)"
      - "Contexto automático da pesquisa da bacia"
    types:
      - completed

jobs:
  prever:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: previsao-ao-vivo-mucum
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0
      - name: Gerar e publicar previsao ao vivo - Mucum
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"

          git pull --rebase --autostash origin main
          python -B -m py_compile codigo_python/01_previsao_ao_vivo/gerar_previsao_ao_vivo_mucum.py scripts/validar_previsao_ao_vivo_mucum.py scripts/test_previsao_ao_vivo_mucum_schema.py
          python -B -m unittest scripts.test_previsao_ao_vivo_mucum_schema
          timeout --signal=TERM --kill-after=20s 240s python -B codigo_python/01_previsao_ao_vivo/gerar_previsao_ao_vivo_mucum.py
          python -B scripts/validar_previsao_ao_vivo_mucum.py
          git add previsao_ao_vivo_mucum.json historico_previsoes_ao_vivo_mucum.json
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
          else
            git commit -m "bot: atualiza previsao_ao_vivo_mucum.json [skip ci]"
            publicado=0
            for tentativa in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                publicado=1
                break
              fi
              echo "push rejeitado (${tentativa}), rebase..."
              sleep 3
            done
            if [ "$publicado" != "1" ]; then
              echo "falha ao publicar previsao_ao_vivo_mucum.json"
              exit 1
            fi
          fi

      # O schedule do GitHub pode ser atrasado ou descartado. O dispatch
      # autenticado com GITHUB_TOKEN cria a proxima execucao sem depender dele.
      - name: Encadear proximo ciclo
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 180
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"previne-mucum-live"}'
