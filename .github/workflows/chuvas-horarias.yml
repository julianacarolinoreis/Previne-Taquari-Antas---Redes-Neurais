name: Chuvas horarias (ANA + INMET + CEMADEN)

# Atualiza incrementalmente a chuva horaria observada e preserva o historico
# assets/data/chuvas_horarias.csv com o COD_SEQUENCIAL. Roda no GitHub Actions
# (as APIs da ANA/INMET/CEMADEN sao bloqueadas na sessao do Claude, mas funcionam
# aqui no CI). CEMADEN/ANA-historico podem exigir credencial via Secrets:
#   CEMADEN_TOKEN, ANA_HIDRO_ID, ANA_HIDRO_SENHA  (opcionais).

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Data inicial (YYYY-MM-DD)'
        default: '2022-12-01'
      fim:
        description: 'Data final (YYYY-MM-DD, vazio = hoje)'
        default: ''
  schedule:
    - cron: '17 * * * *'      # contingencia horaria; o ao-vivo consulta direto

jobs:
  chuvas:
    runs-on: ubuntu-latest
    concurrency:
      group: chuvas-horarias
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Baixar chuvas horarias e publicar
        env:
          CEMADEN_TOKEN: ${{ secrets.CEMADEN_TOKEN }}
          ANA_HIDRO_ID: ${{ secrets.ANA_HIDRO_ID }}
          ANA_HIDRO_SENHA: ${{ secrets.ANA_HIDRO_SENHA }}
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          git pull --rebase --autostash origin main

          python -B -m py_compile \
            previne/robo/fontes_chuva_8h.py \
            codigo_python/10_chuvas/baixar_chuvas_horarias.py

          FIM="${{ github.event.inputs.fim }}"
          INI="${{ github.event.inputs.inicio }}"
          if [ -n "$INI" ] && [ -n "$FIM" ]; then
            python codigo_python/10_chuvas/baixar_chuvas_horarias.py --inicio "$INI" --fim "$FIM"
          elif [ -n "$INI" ]; then
            python codigo_python/10_chuvas/baixar_chuvas_horarias.py --inicio "$INI"
          elif [ -n "$FIM" ]; then
            python codigo_python/10_chuvas/baixar_chuvas_horarias.py --fim "$FIM"
          else
            python codigo_python/10_chuvas/baixar_chuvas_horarias.py
          fi

          git add assets/data/chuvas_horarias.csv
          if git diff --staged --quiet; then
            echo "sem mudanca neste ciclo"
          else
            git commit -m "bot: atualiza chuvas_horarias.csv [skip ci]"
            publicado=0
            for tentativa in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                publicado=1
                echo "publicado"
                break
              fi
              echo "retry $tentativa"; sleep $((tentativa*3))
            done
            if [ "$publicado" != "1" ]; then
              echo "falha ao publicar chuvas_horarias.csv após retries"
              exit 1
            fi
          fi
