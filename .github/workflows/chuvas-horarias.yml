name: Chuvas horarias (ANA + INMET + CEMADEN)

# Atualiza incrementalmente a chuva horaria observada e preserva o historico
# assets/data/chuvas_horarias.csv com o COD_SEQUENCIAL. Roda no GitHub Actions
# (as APIs da ANA/INMET/CEMADEN sao bloqueadas na sessao do Claude, mas funcionam
# aqui no CI). CEMADEN/ANA-historico podem exigir credencial via Secrets:
#   CEMADEN_TOKEN, ANA_HIDRO_ID, ANA_HIDRO_SENHA  (opcionais).

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/chuvas-horarias.yml'
      - 'codigo_python/10_chuvas/baixar_chuvas_horarias.py'
      - 'previne/robo/fontes_chuva_8h.py'
      - 'scripts/test_rain_workflow_publication.py'
      - 'scripts/test_rain_observation_provenance.py'
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Data inicial (YYYY-MM-DD)'
        default: '2022-12-01'
      fim:
        description: 'Data final (YYYY-MM-DD, vazio = hoje)'
        default: ''
  repository_dispatch:
    types:
      - previne-chuvas-horarias
  schedule:
    # Bootstrap/contingência. A atualização nominal é encadeada ao fim de
    # cada rodada para não depender somente do scheduler público do GitHub.
    - cron: '17 * * * *'

jobs:
  chuvas:
    runs-on: ubuntu-latest
    concurrency:
      group: chuvas-horarias
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testar contratos de proveniencia e publicacao
        run: python -B -m unittest scripts.test_rain_observation_provenance scripts.test_rain_workflow_publication -v

      - name: Baixar chuvas horarias e publicar
        env:
          CEMADEN_TOKEN: ${{ secrets.CEMADEN_TOKEN }}
          ANA_HIDRO_ID: ${{ secrets.ANA_HIDRO_ID }}
          ANA_HIDRO_SENHA: ${{ secrets.ANA_HIDRO_SENHA }}
          INI: ${{ github.event.inputs.inicio }}
          FIM: ${{ github.event.inputs.fim }}
        run: |
          git config user.name  "previne-robo"
          git config user.email "previne-robo@users.noreply.github.com"
          args=()
          if [ -n "$INI" ]; then args+=(--inicio "$INI"); fi
          if [ -n "$FIM" ]; then args+=(--fim "$FIM"); fi
          coletar() {
            timeout 120s python -B codigo_python/10_chuvas/baixar_chuvas_horarias.py "${args[@]}" || echo 'Coleta indisponível; validando os arquivos preservados.'
          }
          preparar_commit() {
            python -B scripts/test_rain_workflow_publication.py --validate-pair --allow-legacy-unchanged
            git add --sparse assets/data/chuvas_horarias.csv
            if [ -f assets/data/chuvas_horarias.csv.provenance.json ]; then
              git add --sparse assets/data/chuvas_horarias.csv.provenance.json
            fi
            if git diff --cached --quiet; then
              echo 'Sem mudança neste ciclo.'
              exit 0
            fi
            git commit -m 'bot: atualiza chuva horaria e proveniencia [skip ci]'
          }
          coletar
          preparar_commit
          for tentativa in 1 2 3 4 5; do
            python -B scripts/test_rain_workflow_publication.py --validate-pair --git-ref HEAD --allow-legacy-unchanged
            if git push origin HEAD:main; then
              echo 'Publicado CSV e proveniencia no mesmo commit.'
              exit 0
            fi
            if [ "$tentativa" -eq 5 ]; then break; fi
            # Somente no runner descartável: não rebasear/mesclar artefatos.
            # A nova coleta parte do par já publicado pelo outro writer.
            git fetch origin main
            git reset --keep origin/main
            sleep $((tentativa * 3))
            coletar
            preparar_commit
          done
          echo 'Falha ao publicar o par após 5 tentativas.'
          exit 1

      - name: Encadear próxima atualização das chuvas observadas
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${PREVIOUS_JOB_STATUS}" = "success" ]; then
            echo "nova rodada em 30 min"
            sleep 1800
          else
            echo "rodada falhou; nova tentativa em 10 min"
            sleep 600
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"previne-chuvas-horarias"}'
