name: HEC bacia 145 - lote de calibração

# Roda no GitHub (Linux) um lote de simulações HEC-HMS 4.13 do modelo de 145 sub-bacias / 105 trechos,
# dividido em até 20 jobs em paralelo, e calcula as métricas. Pesquisa; nada aqui é alerta operacional.
# Dois jeitos de pedir um lote:
#  - push na branch de calibração, com calibracao_hec_bacia145/rodadas/PEDIDO.json
#    {rodada, janelas, shards, papeis, candidatos}; sem PEDIDO.json roda o teste de fumaça (2 candidatos x 2 janelas,
#    conferido contra os resultados do PC);
#  - workflow_dispatch (exige o fluxo na branch padrão): candidatos_json, janelas, shards, rodada.

on:
  workflow_dispatch:
    inputs:
      candidatos_json:
        description: "JSON com a lista de candidatos [{id, rota, p}]"
        required: true
        type: string
      janelas:
        description: "cal | todas | lista separada por virgulas (ex.: S2023_09,X20180721)"
        default: cal
        type: string
      shards:
        description: "numero de jobs em paralelo (1 a 20)"
        default: "20"
        type: string
      rodada:
        description: "rotulo da rodada (letras, numeros, hifen)"
        default: manual
        type: string
  push:
    branches: [claude/hec-bacia145-nuvem, "cursor/hec-bacia145-**"]
    paths:
      - "calibracao_hec_bacia145/**"
      - ".github/workflows/hec-bacia145-lote.yml"

permissions:
  contents: read

concurrency:
  group: hec-bacia145-${{ github.event.inputs.rodada || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
      n: ${{ steps.m.outputs.n }}
      rodada: ${{ steps.m.outputs.rodada }}
      janelas: ${{ steps.m.outputs.janelas }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: calibracao_hec_bacia145
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          RODADA_IN: ${{ github.event.inputs.rodada }}
          JANELAS_IN: ${{ github.event.inputs.janelas }}
          SHARDS_IN: ${{ github.event.inputs.shards }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          ped = {}
          p = "calibracao_hec_bacia145/rodadas/PEDIDO.json"
          if os.environ["EVENT"] == "push" and os.path.exists(p):
              ped = json.load(open(p, encoding="utf-8"))
          rodada = re.sub(r"[^A-Za-z0-9_-]", "-", str(ped.get("rodada") or os.environ.get("RODADA_IN") or "smoke"))[:40]
          janelas = re.sub(r"[^A-Za-z0-9_,]", "", str(ped.get("janelas") or os.environ.get("JANELAS_IN") or "S2023_09,S2023_11"))
          n = max(1, min(20, int(ped.get("shards") or os.environ.get("SHARDS_IN") or 2)))
          print("n=%d" % n)
          print("rodada=" + rodada)
          print("janelas=" + janelas)
          print("matriz=" + json.dumps({"shard": list(range(n))}))
          PY

  lote:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    env:
      RODADA: ${{ needs.preparar.outputs.rodada }}
      JANELAS: ${{ needs.preparar.outputs.janelas }}
      EVENT: ${{ github.event_name }}
      CANDS_INPUT: ${{ github.event.inputs.candidatos_json || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: calibracao_hec_bacia145
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências
        run: pip install --disable-pip-version-check numpy scipy
      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1
      - name: Baixar HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4 -o /tmp/HEC-HMS-4.13-linux64.tar.gz https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec
      - name: Montar a pasta de trabalho
        run: |
          export W="$RUNNER_TEMP/w"
          mkdir -p "$W/dados_ana/csv" "$W/forcamento_v3" "$W/forcamento_prevista"
          cp calibracao_hec_bacia145/codigo/*.py "$W/"
          cp calibracao_hec_bacia145/dados/catalogo_ampliado.json "$W/"
          for f in calibracao_hec_bacia145/dados/forcamento_v3/*.gz; do gunzip -c "$f" > "$W/forcamento_v3/$(basename "${f%.gz}")"; done
          # chuva prevista das janelas derivadas <mãe>__<t0>__<modelo> (comum.janela); a pasta pode não existir
          for f in calibracao_hec_bacia145/dados/forcamento_prevista/*.gz; do [ -e "$f" ] || continue; gunzip -c "$f" > "$W/forcamento_prevista/$(basename "${f%.gz}")"; done
          for f in calibracao_hec_bacia145/dados/observados/*.gz; do gunzip -c "$f" > "$W/dados_ana/csv/$(basename "${f%.gz}")"; done
          python3 - <<'PY'
          import json, os
          W = os.environ["W"]
          ped = {}
          p = "calibracao_hec_bacia145/rodadas/PEDIDO.json"
          if os.environ["EVENT"] == "push" and os.path.exists(p):
              ped = json.load(open(p, encoding="utf-8"))
          if os.environ.get("CANDS_INPUT"):
              cands = json.loads(os.environ["CANDS_INPUT"])
          elif ped.get("candidatos"):
              cands = ped["candidatos"]
          else:
              cands = json.load(open("calibracao_hec_bacia145/dados/smoke/cands.json", encoding="utf-8"))
          json.dump(cands, open(W + "/cands.json", "w"))
          if ped.get("papeis"):
              json.dump(ped["papeis"], open(W + "/papeis.json", "w"))
          print(len(cands), "candidatos;", "papeis:", ped.get("papeis"))
          PY
      - name: Rodar o pedaço da rodada
        run: |
          W="$RUNNER_TEMP/w"
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          chmod +x "$HEC_SH"
          export HEC_HMS_CMD="$HEC_SH"
          export HEC_BASIN_BASE="$PWD/calibracao_hec_bacia145/dados/basin/a00_E27.basin"
          export HEC_MDT_CSV="$PWD/calibracao_hec_bacia145/dados/mdt_trechos_atributos.csv"
          export HEC_MDT_SUB="$PWD/calibracao_hec_bacia145/dados/mdt_subbacias_atributos.csv"
          export HEC_CATALOGO=catalogo_ampliado.json HEC_FORC=forcamento_v3 HEC_RUNS="$RUNNER_TEMP/runs"
          [ -f "$W/papeis.json" ] && export HEC_PAPEIS=papeis.json
          cd "$W"
          python -B nuvem_lote.py --candidatos cands.json --janelas "$JANELAS" --shard ${{ matrix.shard }} --shards ${{ needs.preparar.outputs.n }} --saida "$RUNNER_TEMP/saida" --paralelo 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lote-${{ needs.preparar.outputs.rodada }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/saida
          retention-days: 3
          if-no-files-found: warn

  agregar:
    needs: [preparar, lote]
    if: always() && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RODADA: ${{ needs.preparar.outputs.rodada }}
      JANELAS: ${{ needs.preparar.outputs.janelas }}
      EVENT: ${{ github.event_name }}
      CANDS_INPUT: ${{ github.event.inputs.candidatos_json || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: calibracao_hec_bacia145
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: lote-${{ needs.preparar.outputs.rodada }}-*
          path: shards
      - name: Calcular métricas
        run: |
          export W="$RUNNER_TEMP/w"
          mkdir -p "$W/dados_ana/csv" "$W/forcamento_v3"
          cp calibracao_hec_bacia145/codigo/*.py "$W/"
          cp calibracao_hec_bacia145/dados/catalogo_ampliado.json "$W/"
          for f in calibracao_hec_bacia145/dados/observados/*.gz; do gunzip -c "$f" > "$W/dados_ana/csv/$(basename "${f%.gz}")"; done
          python3 - <<'PY'
          import json, os
          W = os.environ["W"]
          ped = {}
          p = "calibracao_hec_bacia145/rodadas/PEDIDO.json"
          if os.environ["EVENT"] == "push" and os.path.exists(p):
              ped = json.load(open(p, encoding="utf-8"))
          if os.environ.get("CANDS_INPUT"):
              cands = json.loads(os.environ["CANDS_INPUT"])
          elif ped.get("candidatos"):
              cands = ped["candidatos"]
          else:
              cands = json.load(open("calibracao_hec_bacia145/dados/smoke/cands.json", encoding="utf-8"))
          json.dump(cands, open(W + "/cands.json", "w"))
          if ped.get("papeis"):
              json.dump(ped["papeis"], open(W + "/papeis.json", "w"))
          # eventos de teste só entram no resultado quando o pedido diz explicitamente que o teste foi aberto
          if ped.get("abrir_teste") is True:
              open(W + "/abrir_teste", "w").write("1")
              print("TESTE ABERTO: as métricas dos eventos de teste vão para o resultado")
          PY
          export HEC_BASIN_BASE="$PWD/calibracao_hec_bacia145/dados/basin/a00_E27.basin"
          export HEC_MDT_CSV="$PWD/calibracao_hec_bacia145/dados/mdt_trechos_atributos.csv"
          export HEC_MDT_SUB="$PWD/calibracao_hec_bacia145/dados/mdt_subbacias_atributos.csv"
          export HEC_CATALOGO=catalogo_ampliado.json HEC_FORC=forcamento_v3
          [ -f "$W/papeis.json" ] && export HEC_PAPEIS=papeis.json
          cd "$W"
          TESTE=""; [ -f abrir_teste ] && TESTE="--teste"
          python -B nuvem_agregar.py --candidatos cands.json --dir "$GITHUB_WORKSPACE/shards" --saida "$GITHUB_WORKSPACE/resultado.json" --janelas "$JANELAS" $TESTE
      - name: Conferir com o PC (só no teste de fumaça)
        if: needs.preparar.outputs.rodada == 'smoke'
        run: |
          python3 - <<'PY'
          import json, sys
          r = {x["id"]: x for x in json.load(open("resultado.json"))}
          e = json.load(open("calibracao_hec_bacia145/dados/smoke/esperado.json"))
          pior = 0.0
          for cid, v in e.items():
              for ev in ("E5", "E12"):
                  a, b = r[cid]["J_ev"].get(ev), v["J_ev"].get(ev)
                  if a is None or b is None:
                      print("FALTA", cid, ev); sys.exit(1)
                  d = abs(a - b) / max(abs(b), 1e-9)
                  pior = max(pior, d)
                  print("%s %s nuvem=%.4f pc=%.4f dif=%.2f%%" % (cid, ev, a, b, 100 * d))
          print("pior diferença relativa: %.2f%%" % (100 * pior))
          sys.exit(0 if pior < 0.05 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-${{ needs.preparar.outputs.rodada }}
          path: resultado.json
          retention-days: 7
          if-no-files-found: warn
