name: QA automatizada da pesquisa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard_bacia.html'
      - 'pesquisa_status.html'
      - 'pesquisa_status_mucum.html'
      - 'assets/css/bacia_dashboard.css'
      - 'assets/js/bacia_dashboard.js'
      - 'assets/js/pv_dashboard.js'
      - 'assets/js/research_patterns_dashboard.js'
      - 'assets/css/pv_dashboard.css'
      - 'assets/data/research_*_latest.json'
      - 'assets/data/research_basin_screening_latest.json'
      - 'scripts/build_basin_research_feed.py'
      - 'scripts/test_basin_research_feed.py'
      - 'scripts/build_binary_research_decision.py'
      - 'scripts/build_visual_research_patterns.py'
      - 'scripts/test_visual_research_patterns.py'
      - 'scripts/test_bacia_dashboard.py'
      - 'scripts/validate_research_dashboard.py'
      - '.github/workflows/research-dashboard-qa.yml'
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: write

concurrency:
  # A QA precisa terminar mesmo enquanto um robô publica um feed. Os
  # publicadores de dados continuam serializados em previne-main-publisher;
  # esta validação usa um cadeado separado para não ser cancelada por eles.
  group: previne-research-qa
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gera respostas binárias da pesquisa
        run: python -B scripts/build_binary_research_decision.py

      - name: Gera feeds compactos do painel visual
        run: python -B scripts/build_visual_research_patterns.py

      - name: Gera contexto integrado da bacia
        run: python -B scripts/build_basin_research_feed.py

      - name: Testa contexto integrado da bacia
        run: python -m unittest scripts/test_basin_research_feed.py -v

      - name: Testa feeds compactos do painel visual
        run: python -m unittest scripts/test_visual_research_patterns.py -v

      - name: Testa contrato do dashboard integrado
        run: python -m unittest scripts/test_bacia_dashboard.py -v

      - name: Valida contratos da dashboard
        id: qa
        run: |
          python -B scripts/validate_research_dashboard.py --report assets/data/research_dashboard_validation_latest.json | tee qa.txt
          cat qa.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publica o resultado da QA
        if: success()
        shell: bash
        run: |
          git config user.name 'previne-qa-bot'
          git config user.email 'previne-qa-bot@users.noreply.github.com'
          git add -- assets/data/research_dashboard_validation_latest.json assets/data/research_basin_screening_latest.json assets/data/research_binary_decision_mucum_latest.json assets/data/research_binary_decision_santa_tereza_latest.json assets/data/research_visual_patterns_mucum_latest.json assets/data/research_visual_patterns_santa_tereza_latest.json
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança no relatório de QA.'
            exit 0
          fi
          git commit -m 'bot: atualiza QA da pesquisa [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            # Se um robô publicar durante a QA, o rebase pode deixar conflitos
            # nos JSONs gerados. Refazemos a QA sobre a main remota, em vez de
            # repetir um checkout conflitado.
            echo "push ocupado; tentando novamente (${attempt}/5)"
            git rebase --abort || true
            git fetch origin main
            git reset --keep origin/main
            python -B scripts/build_binary_research_decision.py
            python -B scripts/build_visual_research_patterns.py
            python -B scripts/build_basin_research_feed.py
            python -B scripts/validate_research_dashboard.py --report assets/data/research_dashboard_validation_latest.json
            git add -- assets/data/research_dashboard_validation_latest.json assets/data/research_basin_screening_latest.json assets/data/research_binary_decision_mucum_latest.json assets/data/research_binary_decision_santa_tereza_latest.json assets/data/research_visual_patterns_mucum_latest.json assets/data/research_visual_patterns_santa_tereza_latest.json
            if git diff --cached --quiet; then
              echo 'QA já foi publicada por outra execução.'
              exit 0
            fi
            git commit -m 'bot: atualiza QA da pesquisa [skip ci]'
            sleep $((attempt * 2))
          done
          exit 1

      - name: Guarda o relatório mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-dashboard-qa
          path: |
            assets/data/research_dashboard_validation_latest.json
            assets/data/research_basin_screening_latest.json
            qa.txt
          retention-days: 14
