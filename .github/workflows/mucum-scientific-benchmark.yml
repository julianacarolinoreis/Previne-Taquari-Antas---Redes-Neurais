name: Benchmark científico Muçum

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_mucum_scientific_benchmark_v1.py"
      - "assets/data/estudo_bacia_taquari_antas/scientific_benchmark_v1/case_20260928_frozen.json"
      - ".github/workflows/mucum-scientific-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mucum-scientific-benchmark
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/build_mucum_scientific_benchmark_v1.py
            assets/data/estudo_bacia_taquari_antas/modelo_mucum_eventwise_v1_fechado_latest.json
            assets/data/estudo_bacia_taquari_antas/scientific_benchmark_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build benchmark status
        run: python -B scripts/build_mucum_scientific_benchmark_v1.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-science-benchmark-bot"
          git config user.email "previne-science-benchmark-bot@users.noreply.github.com"
          git add --sparse -- assets/data/estudo_bacia_taquari_antas/scientific_benchmark_v1
          git diff --cached --quiet && exit 0
          git commit -m "exp: atualiza benchmark científico Muçum [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
