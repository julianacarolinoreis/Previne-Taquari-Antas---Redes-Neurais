name: Muçum fast upstream assimilation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mucum-fast-assimilation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mucum-fast-upstream-assimilation
  cancel-in-progress: true

jobs:
  assimilate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run upstream-state assimilation
        run: python -B scripts/run_mucum_06z_upstream_assimilated.py

      - name: Publish corrected curve
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-bot"
          git config user.email "previne-hec-bot@users.noreply.github.com"
          git add --             assets/data/estudo_bacia_taquari_antas/mucum_06z_upstream_assimilated_latest.json             assets/data/estudo_bacia_taquari_antas/mucum_06z_upstream_assimilated_series.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "bot: Muçum upstream-assimilated forecast [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
