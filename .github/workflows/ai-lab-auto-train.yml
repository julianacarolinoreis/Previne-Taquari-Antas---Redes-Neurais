name: PREVINE AI Lab - treinamento automatico

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "ID do experimento em assets/data/ai_lab/experiments.json"
        required: false
        default: "stz_2h_auto_v1"
  push:
    branches: [main]
    paths:
      - "assets/data/ai_lab/experiments.json"
      - "scripts/ai_lab_auto_train.py"
      - ".github/workflows/ai-lab-auto-train.yml"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: previne-ai-lab-auto-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy openpyxl scikit-learn xgboost

      - name: Run leakage-safe auto training
        run: |
          EXPERIMENT="${{ github.event.inputs.experiment || 'stz_2h_auto_v1' }}"
          python -B scripts/ai_lab_auto_train.py --experiment "$EXPERIMENT"

      - name: Publish auditable leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ai_lab/auto_training_latest.json assets/data/ai_lab/auto_training_leaderboard.csv
          if git diff --cached --quiet; then
            echo "No AI Lab result changes."
          else
            git commit -m "Update AI Lab automatic training results"
            # Outros robôs e edições da interface também escrevem em main.
            # Rebaseia o pequeno commit de resultados sobre a ponta mais nova
            # para não perder uma rodada válida por non-fast-forward.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            echo "Falha ao publicar o leaderboard após 3 tentativas." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: previne-ai-lab-training
          path: |
            assets/data/ai_lab/auto_training_latest.json
            assets/data/ai_lab/auto_training_leaderboard.csv
