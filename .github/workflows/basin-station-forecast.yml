name: Atualiza mapa de estações da bacia

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_basin_station_forecast.py'
      - 'scripts/archive_basin_station_forecast.py'
      - 'scripts/test_basin_station_forecast.py'
      - 'scripts/test_basin_station_catalog.py'
      - 'scripts/test_basin_station_forecast_archive.py'
      - '.github/workflows/basin-station-forecast.yml'
  workflow_dispatch:
  repository_dispatch:
    types:
      - previne-basin-station
  schedule:
    # Bootstrap/recuperação. O ciclo nominal é encadeado por repository_dispatch
    # para não depender do scheduler público do GitHub a cada 5 minutos.
    - cron: '31 * * * *'

permissions:
  contents: write

concurrency:
  group: basin-station-forecast
  # Não cancele uma rodada que já está consultando CEMADEN/SGB/Open-Meteo.
  # Assim uma fila atrasada não cria lacunas deliberadas no feed.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Atualiza o catálogo completo e o feed multi-modelo da bacia
        run: python -B scripts/build_basin_station_forecast.py

      - name: Testa o contrato do feed
        run: python -m unittest scripts.test_basin_station_forecast scripts.test_basin_station_catalog -v

      - name: Arquiva a rodada para avaliação futura dos modelos
        run: python -B scripts/archive_basin_station_forecast.py

      - name: Testa o contrato do arquivo histórico
        run: python -m unittest scripts.test_basin_station_forecast_archive -v

      - name: Publica somente o feed da bacia
        shell: bash
        run: |
          git config user.name 'previne-basin-station-bot'
          git config user.email 'previne-basin-station-bot@users.noreply.github.com'
          git add assets/data/basin_station_forecast_latest.json assets/data/basin_station_forecast_archive
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança no feed.'
            exit 0
          fi
          git commit -m 'bot: atualiza feed multi-modelo das estações da bacia'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push ocupado; reconstruindo sobre a main (tentativa \${attempt}/5)."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --keep origin/main
              python -B scripts/build_basin_station_forecast.py
              python -m unittest scripts.test_basin_station_forecast scripts.test_basin_station_catalog -v
              git add assets/data/basin_station_forecast_latest.json assets/data/basin_station_forecast_archive
              if git diff --cached --quiet; then
                echo 'Feed já publicado por outra execução.'
                exit 0
              fi
              git commit -m 'bot: atualiza feed multi-modelo das estações da bacia'
            }
            sleep $((attempt * 2))
          done
          echo 'Não foi possível publicar após 5 tentativas.'
          exit 1

      - name: Encadear próxima atualização do snapshot
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mantém o snapshot meteorológico andando sem depender do cron de 5 min.
          # O tempo de execução desta rodada + 120 s produz cadência prática
          # próxima de 5 min sem sobrepor consultas ao Open-Meteo.
          sleep 120
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"previne-basin-station"}'
