name: Audita histórico Muçum x ANA

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_mucum_historical_source_samples.py"
      - ".github/workflows/audit-mucum-historical-source-samples.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-mucum-historical-source-samples
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/audit_mucum_historical_source_samples.py
            assets/data/chuvas_horarias.csv
            assets/data/hec_hms_audit/raw/ana/supplemental
            assets/data/hec_hms_audit/mucum_historical_source_spotcheck
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebaixa ANA e compara com arquivo histórico
        run: python -B scripts/audit_mucum_historical_source_samples.py

      - name: Mostra resumo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/data/hec_hms_audit/mucum_historical_source_spotcheck/mucum_historical_source_spotcheck_latest.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
            "overall_verdict":d["overall_verdict"],
            "events":[{
              "event_id":e["event_id"],
              "verdict":e["verdict"],
              "rain":e["rain_comparison"],
              "false_zeros":e["rain_false_zero_count_where_fresh_positive"],
              "level":e["target_comparison"]["level"],
              "flow":e["target_comparison"]["flow"],
              "rain_examples":e["rain_examples"],
              "target_examples":e["target_examples"],
            } for e in d["events"]]
          },ensure_ascii=False,indent=2))
          PY

      - name: Publica auditoria
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-source-audit-bot"
          git config user.email "previne-source-audit-bot@users.noreply.github.com"
          git add --sparse -- assets/data/hec_hms_audit/mucum_historical_source_spotcheck
          git diff --cached --quiet && exit 0
          git commit -m "audit: resultado histórico Muçum x ANA [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
