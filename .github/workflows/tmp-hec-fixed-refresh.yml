name: Temporary HEC Muçum fixed calibration refresh

on:
  push:
    branches:
      - tmp-hec-ifs-20260928-2148
    paths:
      - ".github/workflows/tmp-hec-fixed-refresh.yml"

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tmp-hec-ifs-20260928-2148
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --disable-pip-version-check shapely pyproj matplotlib

      - name: Refresh observed multistation
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: Refresh ECMWF IFS spatial field
        run: python -B scripts/build_spatial_ifs_mucum.py

      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4             -o /tmp/HEC-HMS-4.13-linux64.tar.gz             https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Refit only HEC internal initial state with newest IFS
        shell: bash
        env:
          HEC_PARAM_EVENT: E28
          HEC_INITIAL_LOSS_MM: "20"
          HEC_CONSTANT_LOSS_MM_H: "3"
          HEC_TC_H: "25"
          HEC_STORAGE_H: "20"
          HEC_RECESSION_DAILY: "0.9"
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          for M in 0.75 0.80 0.85 0.90 0.95 1.00; do
            export HEC_INITIAL_FLOW_MULTIPLIER="$M"
            python -B scripts/build_hec_hms_spatial_forecast_mucum.py
            rm -f assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/hec_output_values.csv
            "$HEC_SH" -s "$PWD/assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/project/run_forecast.script" >"/tmp/hec_fixed_${M}.log" 2>&1
            python -B scripts/postprocess_hec_hms_spatial_forecast_mucum.py
            cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json "/tmp/hec_fixed_${M}.json"
          done
          python - <<'PY'
          import glob, json
          rows=[]
          for p in sorted(glob.glob("/tmp/hec_fixed_*.json")):
              d=json.load(open(p,encoding="utf-8"))
              v=d.get("validation") or {}
              f=v.get("event_hydrograph_since_20260926") or {}
              stage=abs(float(v.get("stage_error_at_t0_cm") or 9999))
              qerr=abs(float(v.get("q_error_pct") or 9999))
              trend=abs(float(v.get("model_trend_next_1h_cm") or 9999)-float(v.get("observed_trend_last_1h_cm") or 0))
              nse=float(f.get("nse") or -999)
              rmse=float(f.get("rmse_cm") or 9999)
              mult=float((d.get("parameter_source") or {}).get("initial_flow_multiplier") or 0)
              eligible=(nse>=0.75 and qerr<=10 and trend<=10)
              score=stage + 0.25*qerr + 0.5*trend + max(0,0.75-nse)*100 + max(0,rmse-60)*0.2
              rows.append((eligible,score,stage,qerr,trend,nse,rmse,mult,p,d))
          pool=[r for r in rows if r[0]] or rows
          best=min(pool,key=lambda r:(r[1],r[2]))
          d=best[-1]
          d["temporary_initial_state_search"]={
              "method":"fixed validated rainfall-runoff parameters; searched only HEC initial-flow multiplier",
              "tested_multipliers":[r[7] for r in rows],
              "selected_multiplier":best[7],
              "selection_score":round(best[1],4),
              "selected_state_error_cm":round(best[2],3),
              "selected_q_error_pct":round(best[3],3),
              "selected_trend_gap_cm_h":round(best[4],3),
              "selected_event_nse":round(best[5],5),
              "selected_event_rmse_cm":round(best[6],3)
          }
          out="assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_calib_new_ifs_20260928_2148.json"
          with open(out,"w",encoding="utf-8") as f:
              json.dump(d,f,ensure_ascii=False,indent=2)
              f.write("\n")
          print(json.dumps(d["temporary_initial_state_search"],ensure_ascii=False))
          PY

      - name: Commit temporary result to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-bot"
          git config user.email "previne-hec-bot@users.noreply.github.com"
          git add assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_calib_new_ifs_20260928_2148.json
          git commit -m "tmp: refit HEC initial state with newest IFS [skip ci]"
          git push origin HEAD:tmp-hec-ifs-20260928-2148
