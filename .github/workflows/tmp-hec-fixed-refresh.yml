name: Temporary HEC Muçum fixed calibration refresh

on:
  push:
    branches:
      - tmp-hec-ifs-20260928-2148
    paths:
      - ".github/workflows/tmp-hec-fixed-refresh.yml"

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tmp-hec-ifs-20260928-2148
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --disable-pip-version-check shapely pyproj matplotlib

      - name: Refresh observed multistation
        run: OBS_FAST_MODE=1 python -B scripts/build_mucum_observed_multistation.py

      - name: Refresh ECMWF IFS spatial field
        run: python -B scripts/build_spatial_ifs_mucum.py

      - name: Cache HEC-HMS 4.13
        id: cache-hec
        uses: actions/cache@v4
        with:
          path: .hec
          key: hec-hms-4.13-linux64-v1

      - name: Download HEC-HMS 4.13
        if: steps.cache-hec.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hec
          curl -L --fail --retry 3 --retry-delay 4             -o /tmp/HEC-HMS-4.13-linux64.tar.gz             https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.38/HEC-HMS-4.13-linux64.tar.gz
          tar -xzf /tmp/HEC-HMS-4.13-linux64.tar.gz -C .hec

      - name: Run HEC-HMS with validated 19h calibration and newest IFS
        shell: bash
        env:
          HEC_PARAM_EVENT: E28
          HEC_INITIAL_LOSS_MM: "20"
          HEC_CONSTANT_LOSS_MM_H: "3"
          HEC_TC_H: "25"
          HEC_STORAGE_H: "20"
          HEC_RECESSION_DAILY: "0.9"
          HEC_INITIAL_FLOW_MULTIPLIER: "0.75"
        run: |
          set -euo pipefail
          HEC_SH="$(find "$PWD/.hec" -type f -name 'hec-hms.sh' | head -n 1)"
          test -n "$HEC_SH"
          python -B scripts/build_hec_hms_spatial_forecast_mucum.py
          rm -f assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/hec_output_values.csv
          "$HEC_SH" -s "$PWD/assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/project/run_forecast.script"
          python -B scripts/postprocess_hec_hms_spatial_forecast_mucum.py
          cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum_latest.json              assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_calib_new_ifs_20260928_2148.json
          cp assets/data/estudo_bacia_taquari_antas/hec_hms_spatial_forecast_mucum/forecast_input.json              assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_calib_new_ifs_20260928_2148_input.json

      - name: Commit temporary result to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "previne-hec-bot"
          git config user.email "previne-hec-bot@users.noreply.github.com"
          git add assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_calib_new_ifs_20260928_2148.json                   assets/data/estudo_bacia_taquari_antas/hec_hms_fixed_calib_new_ifs_20260928_2148_input.json
          git commit -m "tmp: fixed calibration HEC with newest IFS [skip ci]"
          git push origin HEAD:tmp-hec-ifs-20260928-2148
