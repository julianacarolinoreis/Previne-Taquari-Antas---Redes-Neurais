name: Atualiza feed meteorológico de Muçum

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: previne-main-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configura ecCodes para ler GRIB2 do ECMWF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev
          python -m pip install --disable-pip-version-check eccodes

      - name: Gera somente o feed meteorológico
        run: python -B scripts/build_mucum_weather_feed.py

      - name: Gera resposta binária da pesquisa
        run: python -B scripts/build_binary_research_decision.py

      - name: Valida a dashboard sem rede
        run: python -B scripts/validate_research_dashboard.py --report assets/data/research_dashboard_validation_latest.json

      - name: Publica somente o feed meteorológico
        shell: bash
        run: |
          git config user.name 'previne-weather-bot'
          git config user.email 'previne-weather-bot@users.noreply.github.com'
          git add -- assets/data/research_weather_mucum_latest.json assets/data/research_binary_decision_mucum_latest.json assets/data/research_binary_decision_santa_tereza_latest.json assets/data/research_dashboard_validation_latest.json
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança no feed.'
            exit 0
          fi
          git commit -m 'bot: atualiza previsão meteorológica de Muçum'
          # Outros robôs também publicam no main. Rebaseia e tenta novamente
          # para que uma atualização meteorológica não seja perdida por corrida.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push ocupado; sincronizando (tentativa ${attempt}/5)."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python -B scripts/build_mucum_weather_feed.py
              python -B scripts/build_binary_research_decision.py
              git add -- assets/data/research_weather_mucum_latest.json assets/data/research_binary_decision_mucum_latest.json assets/data/research_binary_decision_santa_tereza_latest.json
              if git diff --cached --quiet; then
                echo 'Feed já foi publicado por outra execução.'
                exit 0
              fi
              git commit -m 'bot: atualiza previsão meteorológica de Muçum'
            fi
            sleep $((attempt * 2))
          done
          echo 'Não foi possível publicar após 5 tentativas.'
          exit 1
