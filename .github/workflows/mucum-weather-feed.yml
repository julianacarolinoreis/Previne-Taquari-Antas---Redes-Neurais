name: Atualiza feed meteorológico de Muçum

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: mucum-weather-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gera somente o feed meteorológico
        run: python -B scripts/build_mucum_weather_feed.py

      - name: Publica somente o feed meteorológico
        shell: bash
        run: |
          git config user.name 'previne-weather-bot'
          git config user.email 'previne-weather-bot@users.noreply.github.com'
          git add -- assets/data/research_weather_mucum_latest.json
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança no feed.'
            exit 0
          fi
          git commit -m 'bot: atualiza previsão meteorológica de Muçum'
          git push origin HEAD:main
